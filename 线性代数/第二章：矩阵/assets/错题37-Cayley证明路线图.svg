<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4f46e5"/>
    </marker>
    <style>
      .title{font:700 30px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#111827}
      .box{fill:#f8fafc;stroke:#4f46e5;stroke-width:2.5;rx:18;ry:18}
      .warn{fill:#fff7ed;stroke:#f97316;stroke-width:2.5;rx:18;ry:18}
      .ok{fill:#ecfdf5;stroke:#10b981;stroke-width:2.5;rx:18;ry:18}
      .txt{font:22px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#111827}
      .small{font:19px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#374151}
      .formula{font:21px 'Times New Roman','Cambria Math',serif;fill:#111827}
      .arrow{stroke:#4f46e5;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .bad{font:20px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#b91c1c}
    </style>
  </defs>
  <text x="590" y="44" text-anchor="middle" class="title">错题37：Cayley 变换证明路线</text>

  <rect x="55" y="90" width="300" height="110" class="box"/>
  <text x="205" y="126" text-anchor="middle" class="txt">第（1）问先别搬逆矩阵</text>
  <text x="205" y="160" text-anchor="middle" class="formula">(E+A)(E-A) = (E-A)(E+A)</text>
  <text x="205" y="188" text-anchor="middle" class="small">同源多项式：都等于 E - A²</text>

  <rect x="440" y="90" width="300" height="110" class="ok"/>
  <text x="590" y="126" text-anchor="middle" class="txt">再推出逆矩阵也可交换</text>
  <text x="590" y="160" text-anchor="middle" class="formula">Y X⁻¹ = X⁻¹ Y</text>
  <text x="590" y="188" text-anchor="middle" class="small">X=E+A，Y=E-A，且 X 可逆</text>

  <rect x="825" y="90" width="300" height="110" class="box"/>
  <text x="975" y="126" text-anchor="middle" class="txt">得到第（1）问结论</text>
  <text x="975" y="160" text-anchor="middle" class="formula">(E-A)(E+A)⁻¹ = (E+A)⁻¹(E-A)</text>
  <text x="975" y="188" text-anchor="middle" class="small">给第（2）问换序铺路</text>

  <path d="M355 145 H430" class="arrow"/>
  <path d="M740 145 H815" class="arrow"/>

  <rect x="55" y="295" width="300" height="120" class="warn"/>
  <text x="205" y="332" text-anchor="middle" class="txt">第（2）问的启动条件</text>
  <text x="205" y="366" text-anchor="middle" class="formula">Aᵀ = -A</text>
  <text x="205" y="394" text-anchor="middle" class="small">(E-A)ᵀ=E+A，(E+A)ᵀ=E-A</text>

  <rect x="440" y="295" width="300" height="120" class="box"/>
  <text x="590" y="332" text-anchor="middle" class="txt">先求转置，注意反序</text>
  <text x="590" y="366" text-anchor="middle" class="formula">Qᵀ = (E-A)⁻¹(E+A)</text>
  <text x="590" y="394" text-anchor="middle" class="small">E-A 可逆来自 (E+A)ᵀ 可逆</text>

  <rect x="825" y="295" width="300" height="120" class="ok"/>
  <text x="975" y="332" text-anchor="middle" class="txt">最后相邻抵消</text>
  <text x="975" y="366" text-anchor="middle" class="formula">QᵀQ = E</text>
  <text x="975" y="394" text-anchor="middle" class="small">先把中间两项换序，再抵消</text>

  <path d="M355 355 H430" class="arrow"/>
  <path d="M740 355 H815" class="arrow"/>
  <path d="M975 200 V285" class="arrow"/>

  <text x="590" y="475" text-anchor="middle" class="bad">红线：不要隔着中间矩阵抵消；矩阵乘法不是实数乘法。</text>
</svg>
