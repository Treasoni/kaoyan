apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: opencli-browser
  version: 0.1.0
  description: "Use when an agent needs to drive a real Chrome window via opencli — inspect a page, fill forms, click through logged-in flows, or extract data ad-hoc. Covers the selector-first target contract, compound form fields, stal"
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.opencli-browser
  permissions:
    filesystem: write
    network: allow
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
