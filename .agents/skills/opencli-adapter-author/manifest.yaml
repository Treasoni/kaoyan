apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: opencli-adapter-author
  version: 0.1.0
  description: "Use when writing an OpenCLI adapter for a new site or adding a new command to an existing site. Guides end-to-end from first recon through field decoding, adapter coding, and verify. Replaces opencli-oneshot / opencli-ex"
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.opencli-adapter-author
  permissions:
    filesystem: write
    network: allow
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
