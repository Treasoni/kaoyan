apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: skill-refactor
  version: 0.1.0
  description: "技能自动化重构器 - 自动提取代码到code.md、拆分过长内容、优化技能结构。**自动触发**：每次修改.Codex/skills目录下的SKILL.md或code.md后检测并提示用户确认。手动触发：当用户提到\"重构技能\"、\"拆分技能\"、\"技能代码分离\"、\"优化技能结构\"时使用此skill。"
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.skill-refactor
  permissions:
    filesystem: write
    network: none
    subprocess: allow
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
