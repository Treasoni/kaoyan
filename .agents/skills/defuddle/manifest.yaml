apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: defuddle
  version: 0.1.0
  description: "Extract clean markdown content from web pages using Defuddle CLI, removing clutter and navigation to save tokens. Use instead of WebFetch when the user provides a URL to read or analyze, for online documentation, article"
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.defuddle
  permissions:
    filesystem: write
    network: allow
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
