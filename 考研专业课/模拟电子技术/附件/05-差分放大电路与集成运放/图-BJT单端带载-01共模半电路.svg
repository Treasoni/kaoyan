<text x="65" y="215" font-size="28" fill="#17212b">+</text>
<text x="55" y="635" font-size="28" fill="#17212b">−</text>
<text x="80" y="335" font-size="26" fill="#175fa0">uic</text>
<text x="290" y="210" font-size="25" fill="#17212b">b</text>
<text x="490" y="210" font-size="25" fill="#17212b">c</text>
<text x="290" y="490" font-size="25" fill="#17212b">e</text>
<text x="895" y="250" font-size="28" fill="#17212b">+</text>
<text x="895" y="442.5" font-size="25" fill="#175fa0">uo1</text>
<text x="895" y="650" font-size="28" fill="#17212b">−</text>
<path d="M300,285 L300,330" fill="none" stroke="#175fa0" stroke-width="3" marker-end="url(#arr)"/>
<text x="255" y="315" font-size="22" fill="#175fa0">ib</text>
<text x="1010" y="195" font-size="29" fill="#17212b">为什么是 2RE？</text>
<text x="1010" y="260" font-size="24" fill="#17212b">每管：ie = (1+β)ib</text>
<text x="1010" y="320" font-size="24" fill="#17212b">全尾部：it = 2(1+β)ib</text>
<text x="1010" y="380" font-size="24" fill="#17212b">公共节点：ue = it RE</text>
<text x="1010" y="440" font-size="24" fill="#17212b">半电路：ue = ie · (2RE)</text>
<text x="1010" y="530" font-size="24" fill="#17212b">输出受控源仍从 c 指向 e。</text>
<text x="1010" y="580" font-size="24" fill="#17212b">RC、RL 接交流地；</text>
<text x="1010" y="620" font-size="24" fill="#17212b">发射极 e 在共模下不接地。</text>
<text x="80" y="800" font-size="29" fill="#17212b">输入 KVL：uic = ib Rb + ib rbe + (1+β)ib · 2RE</text>
<text x="80" y="865" font-size="29" fill="#17212b">输出 KCL：uo1 = −βib (RC ∥ RL)</text>
<text x="80" y="940" font-size="32" fill="#175fa0">Auc1 = −β(RC ∥ RL) / [Rb + rbe + 2(1+β)RE]</text>
<text x="80" y="1020" font-size="26" fill="#17212b">共模时两管增量电流同向相加，尾部电阻形成负反馈。</text>
</g></svg>