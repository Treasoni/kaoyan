<text x="65" y="65" font-size="36" fill="#17212b">单端带载：共模半电路</text>
<text x="65" y="106" font-size="23" fill="#51606d">两管匹配且处于放大区；忽略 Early 效应。直流电压源置零，RL 接输出节点与地。</text>
