<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <!--
    Netlist card:
    Q1/Q2: matched NPN BJT differential pair; bases are DC-grounded through Rb.
    Q1 collector: +VCC1 -> RC -> VCQ1 -> Q1; RL is connected from VCQ1 to ground.
    Q2 collector: +VCC2 -> RC -> VCQ2 -> Q2; no RL on the right.
    Emitters join and return through RE to -VEE.
    DC mode: input sources are zeroed, capacitors (if any) are open.
  -->
  <defs>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#b42318"/>
    </marker>
  </defs>
  <rect width="1600" height="1120" fill="#ffffff"/>
  <style>
    .wire { stroke:#111111; stroke-width:4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .thin { stroke:#111111; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .dash { stroke:#777777; stroke-width:3; fill:none; stroke-dasharray:10 8; }
    .title { font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif; font-size:34px; font-weight:700; fill:#111111; }
    .panel { font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif; font-size:28px; font-weight:700; fill:#111111; }
    .label { font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif; font-size:22px; fill:#111111; }
    .small { font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif; font-size:20px; fill:#333333; }
    .formula { font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif; font-size:21px; fill:#111111; }
    .red { font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif; font-size:21px; fill:#b42318; }
    .blue { font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif; font-size:21px; fill:#1259a8; }
    .box { fill:#ffffff; stroke:#111111; stroke-width:3; }
  </style>

  <text x="70" y="58" class="title">BJT 差分对：单端输出带负载时的静态工作点</text>
  <text x="70" y="94" class="small">输入源置零；两侧电源可不相等，左侧集电极节点必须单独列 KCL。</text>

  <rect x="60" y="120" width="760" height="900" rx="12" fill="#fffaf6" stroke="#d69a62" stroke-width="3"/>
  <text x="85" y="158" class="panel">一、直流等效电路</text>
  <text x="505" y="158" class="small">VCC1、VCC2 保持独立</text>

  <!-- independent collector supply branches -->
  <line x1="185" y1="210" x2="320" y2="210" class="wire"/>
  <text x="190" y="198" class="label">+VCC1</text>
  <line x1="250" y1="210" x2="250" y2="242" class="wire"/>
  <rect x="232" y="242" width="36" height="70" class="box"/>
  <line x1="250" y1="312" x2="250" y2="355" class="wire"/>
  <text x="205" y="340" class="label">RC</text>

  <line x1="500" y1="210" x2="635" y2="210" class="wire"/>
  <text x="505" y="198" class="label">+VCC2</text>
  <line x1="565" y1="210" x2="565" y2="242" class="wire"/>
  <rect x="547" y="242" width="36" height="70" class="box"/>
  <line x1="565" y1="312" x2="565" y2="355" class="wire"/>
  <text x="520" y="340" class="label">RC</text>

  <!-- Q1 NPN: base at x225, collector node VCQ1, emitter to common tail -->
  <line x1="225" y1="390" x2="225" y2="480" class="wire"/>
  <line x1="225" y1="390" x2="250" y2="355" class="wire"/>
  <line x1="225" y1="480" x2="365" y2="535" class="wire"/>
  <polygon points="356,532 337,520 344,511" fill="#111111"/>
  <circle cx="250" cy="355" r="5" fill="#111111"/>
  <text x="202" y="375" class="label">Q1</text>
  <text x="270" y="345" class="red">VCQ1</text>

  <!-- Q2 NPN: separate collector node VCQ2, no load branch -->
  <line x1="505" y1="390" x2="505" y2="480" class="wire"/>
  <line x1="505" y1="390" x2="565" y2="355" class="wire"/>
  <line x1="505" y1="480" x2="385" y2="535" class="wire"/>
  <polygon points="394,532 413,520 406,511" fill="#111111"/>
  <circle cx="565" cy="355" r="5" fill="#111111"/>
  <text x="492" y="375" class="label">Q2</text>
  <text x="585" y="325" class="red">VCQ2</text>

  <!-- DC-zero input branches -->
  <line x1="225" y1="435" x2="180" y2="435" class="wire"/>
  <rect x="135" y="417" width="45" height="36" class="box"/>
  <text x="142" y="442" class="small">Rb</text>
  <line x1="135" y1="435" x2="105" y2="435" class="wire"/>
  <line x1="105" y1="435" x2="105" y2="480" class="wire"/>
  <line x1="90" y1="480" x2="120" y2="480" class="wire"/>
  <line x1="96" y1="488" x2="114" y2="488" class="thin"/>
  <line x1="102" y1="496" x2="108" y2="496" class="thin"/>
  <text x="84" y="412" class="blue">ui1=0</text>

  <line x1="505" y1="435" x2="550" y2="435" class="wire"/>
  <rect x="550" y="417" width="45" height="36" class="box"/>
  <text x="557" y="442" class="small">Rb</text>
  <line x1="595" y1="435" x2="625" y2="435" class="wire"/>
  <line x1="625" y1="435" x2="625" y2="480" class="wire"/>
  <line x1="610" y1="480" x2="640" y2="480" class="wire"/>
  <line x1="616" y1="488" x2="634" y2="488" class="thin"/>
  <line x1="622" y1="496" x2="628" y2="496" class="thin"/>
  <text x="600" y="412" class="blue">ui2=0</text>

  <!-- single-ended load from VCQ1 to ground -->
  <line x1="250" y1="355" x2="250" y2="390" class="wire"/>
  <rect x="232" y="390" width="36" height="70" class="box"/>
  <text x="280" y="430" class="label">RL</text>
  <line x1="250" y1="460" x2="250" y2="510" class="wire"/>
  <line x1="235" y1="510" x2="265" y2="510" class="wire"/>
  <line x1="241" y1="518" x2="259" y2="518" class="thin"/>
  <line x1="247" y1="526" x2="253" y2="526" class="thin"/>
  <text x="280" y="380" class="blue">单端输出节点</text>

  <!-- common emitter tail -->
  <line x1="365" y1="535" x2="385" y2="535" class="wire"/>
  <line x1="375" y1="535" x2="375" y2="585" class="wire"/>
  <rect x="357" y="585" width="36" height="70" class="box"/>
  <text x="405" y="625" class="label">RE</text>
  <line x1="375" y1="655" x2="375" y2="705" class="wire"/>
  <line x1="360" y1="705" x2="390" y2="705" class="wire"/>
  <line x1="366" y1="713" x2="384" y2="713" class="thin"/>
  <line x1="372" y1="721" x2="378" y2="721" class="thin"/>
  <text x="405" y="685" class="label">−VEE</text>

  <!-- current directions -->
  <line x1="285" y1="250" x2="285" y2="330" class="wire" marker-end="url(#redArrow)"/>
  <text x="295" y="265" class="red">I1</text>
  <line x1="285" y1="460" x2="285" y2="500" class="wire" marker-end="url(#redArrow)"/>
  <text x="295" y="490" class="red">I2</text>
  <line x1="205" y1="350" x2="205" y2="385" class="wire" marker-end="url(#redArrow)"/>
  <text x="140" y="350" class="red">ICQ</text>
  <line x1="625" y1="350" x2="625" y2="385" class="wire" marker-end="url(#redArrow)"/>
  <text x="635" y="350" class="red">ICQ</text>

  <text x="92" y="790" class="red">左侧节点：I1 = ICQ + I2</text>
  <text x="92" y="830" class="small">I1 经过左 RC；I2 经 RL 流向地。</text>
  <text x="92" y="870" class="small">右侧无 RL：ICQ 仅由右 RC 支路提供。</text>
  <text x="92" y="915" class="blue">两条 VCC 支路独立，不相连。</text>

  <!-- calculation panel -->
  <rect x="850" y="120" width="690" height="900" rx="12" fill="#f7fbff" stroke="#7aa7d9" stroke-width="3"/>
  <text x="875" y="158" class="panel">二、静态计算链</text>
  <text x="875" y="205" class="formula">IB1Q = IB2Q = IBQ</text>
  <text x="875" y="242" class="formula">IC1Q = IC2Q = ICQ = βIBQ</text>
  <text x="875" y="279" class="formula">IT = 2(1+β)IBQ</text>
  <text x="875" y="330" class="formula">IBQ = (VEE − VBEQ) / [Rb + 2(1+β)RE]</text>
  <text x="875" y="367" class="formula">VEQ = −VEE + 2(1+β)IBQRE</text>
  <line x1="875" y1="395" x2="1500" y2="395" class="dash"/>

  <text x="875" y="440" class="formula">I1 = (VCC1 − VCQ1) / RC</text>
  <text x="875" y="477" class="formula">I2 = VCQ1 / RL</text>
  <text x="875" y="514" class="red">ICQ = I1 − I2</text>
  <text x="875" y="551" class="formula">VCQ1 = (VCC1/RC − ICQ)(RC ∥ RL)</text>
  <text x="875" y="588" class="formula">VCEQ1 = VCQ1 − VEQ</text>
  <line x1="875" y1="616" x2="1500" y2="616" class="dash"/>

  <text x="875" y="661" class="formula">VCQ2 = VCC2 − ICQRC</text>
  <text x="875" y="698" class="formula">VCEQ2 = VCQ2 − VEQ</text>
  <text x="875" y="750" class="red">检查：VCEQ1、VCEQ2 &gt; VCE,sat</text>
  <text x="875" y="790" class="small">若左侧 RL 使 VCQ1 过低，Q1 先进入饱和；</text>
  <text x="875" y="823" class="small">此时不能继续套用 ICQ = βIBQ 的放大区公式。</text>
  <text x="875" y="885" class="blue">记忆：先求管电流，再按节点 KCL 求 VCQ1。</text>
  <text x="875" y="930" class="small">电源不对称时保留 VCC1、VCC2；相等时令二者均为 VCC。</text>
  <text x="875" y="975" class="small">单端输出取左侧，静态输出点就是 VCQ1。</text>
</svg>
