<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1500" viewBox="0 0 2600 1500">
  <defs>
    <style>
      .title { font: 700 56px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2937; }
      .panel-title { font: 700 38px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2937; }
      .label { font: 30px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2937; }
      .small { font: 25px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #374151; }
      .formula { font: 30px "Times New Roman", "STIX Two Text", serif; fill: #111827; }
      .wire { fill: none; stroke: #111827; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .feedback { fill: none; stroke: #7e22ce; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
      .positive { fill: none; stroke: #b91c1c; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .negative { fill: none; stroke: #1d4ed8; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .panel { fill: #fffdf7; stroke: #d6c9a8; stroke-width: 4; rx: 28; }
      .card { fill: #fffaf0; stroke: #ead8ae; stroke-width: 3; rx: 24; }
      .node { fill: #111827; }
      .red { fill: #b91c1c; }
      .blue { fill: #1d4ed8; }
      .purple { fill: #7e22ce; }
    </style>
  </defs>

  <rect width="2600" height="1500" fill="#f8efd6"/>
  <text x="1300" y="78" text-anchor="middle" class="title">加减运算与差分比例运算</text>
  <text x="1300" y="122" text-anchor="middle" class="small">反相端贡献负权重，同相端贡献正权重；差分比例是两输入加减运算的对称特例</text>

  <!-- Panel A: four-input add/subtract -->
  <rect x="65" y="165" width="2470" height="690" class="panel"/>
  <text x="1300" y="225" text-anchor="middle" class="panel-title">A. 四输入加减运算电路</text>
  <text x="1300" y="268" text-anchor="middle" class="small">先分别求 N、P 节点电压，再用负反馈得到 uN ≈ uP；匹配后得到正负加权和</text>

  <!-- op amp -->
  <path d="M750 340 L750 650 L1110 495 Z" fill="#ffffff" stroke="#111827" stroke-width="9"/>
  <text x="782" y="430" class="label">−</text>
  <text x="782" y="585" class="label">+</text>
  <text x="930" y="510" text-anchor="middle" class="label">A</text>

  <!-- N-side inputs -->
  <path d="M150 380 L235 380" class="wire"/>
  <path d="M235 380 l18 -18 l36 36 l36 -36 l36 36 l18 -18" class="wire"/>
  <path d="M415 380 L750 380" class="negative"/>
  <text x="95" y="390" class="formula">uᵢ₁</text>
  <text x="325" y="350" class="formula">R₁</text>

  <path d="M150 455 L235 455" class="wire"/>
  <path d="M235 455 l18 -18 l36 36 l36 -36 l36 36 l18 -18" class="wire"/>
  <path d="M415 455 L750 455" class="negative"/>
  <text x="95" y="465" class="formula">uᵢ₂</text>
  <text x="325" y="425" class="formula">R₂</text>

  <circle cx="750" cy="380" r="10" class="node"/>
  <text x="715" y="350" class="formula">N</text>

  <!-- P-side inputs -->
  <path d="M150 575 L235 575" class="wire"/>
  <path d="M235 575 l18 -18 l36 36 l36 -36 l36 36 l18 -18" class="wire"/>
  <path d="M415 575 L750 575" class="positive"/>
  <text x="95" y="585" class="formula">uᵢ₃</text>
  <text x="325" y="545" class="formula">R₃</text>

  <path d="M150 650 L235 650" class="wire"/>
  <path d="M235 650 l18 -18 l36 36 l36 -36 l36 36 l18 -18" class="wire"/>
  <path d="M415 650 L650 650 L650 575 L750 575" class="positive"/>
  <text x="95" y="660" class="formula">uᵢ₄</text>
  <text x="325" y="620" class="formula">R₄</text>

  <circle cx="750" cy="575" r="10" class="node"/>
  <text x="715" y="545" class="formula">P</text>

  <!-- R5 from P to ground -->
  <path d="M650 575 L650 720" class="wire"/>
  <path d="M650 720 l18 -18 l36 36 l36 -36 l18 18" class="wire"/>
  <path d="M760 720 L760 770" class="wire"/>
  <path d="M735 770 L785 770 M743 785 L777 785 M751 800 L769 800" class="wire"/>
  <text x="810" y="745" class="formula">R₅</text>

  <!-- output and feedback -->
  <path d="M1110 495 L1510 495" class="wire"/>
  <text x="1535" y="505" class="formula">uₒ</text>
  <path d="M1340 495 L1340 300 L1220 300" class="feedback"/>
  <path d="M1220 300 l-18 -18 l-36 36 l-36 -36 l-36 36 l-36 -36 l-18 18" class="feedback"/>
  <path d="M1040 300 L620 300 L620 380 L750 380" class="feedback"/>
  <text x="1130" y="275" class="formula purple">R_f</text>

  <!-- polarity/weight legend -->
  <text x="1740" y="385" class="label blue">反相端：负权重</text>
  <text x="1740" y="445" class="formula blue">−R_f(uᵢ₁/R₁ + uᵢ₂/R₂)</text>
  <text x="1740" y="555" class="label red">同相端：正权重</text>
  <text x="1740" y="615" class="formula red">+R_f(uᵢ₃/R₃ + uᵢ₄/R₄)</text>
  <text x="1740" y="725" class="small">匹配条件：R₁∥R₂∥R_f = R₃∥R₄∥R₅</text>
  <text x="1740" y="770" class="small">结论：uₒ = R_f(uᵢ₃/R₃ + uᵢ₄/R₄ − uᵢ₁/R₁ − uᵢ₂/R₂)</text>

  <!-- Panel B: difference amplifier -->
  <rect x="65" y="900" width="2470" height="520" class="panel"/>
  <text x="1300" y="960" text-anchor="middle" class="panel-title">B. 两输入差分比例运算电路</text>
  <text x="1300" y="1000" text-anchor="middle" class="small">四个电阻按比例匹配时，输出只响应差模输入并抑制共模输入</text>

  <path d="M760 1080 L760 1320 L1090 1200 Z" fill="#ffffff" stroke="#111827" stroke-width="9"/>
  <text x="790" y="1150" class="label">−</text>
  <text x="790" y="1270" class="label">+</text>
  <text x="925" y="1210" text-anchor="middle" class="label">A</text>

  <!-- inverting input -->
  <path d="M150 1140 L245 1140" class="wire"/>
  <path d="M245 1140 l18 -18 l36 36 l36 -36 l36 36 l18 -18" class="wire"/>
  <path d="M425 1140 L760 1140" class="negative"/>
  <text x="95" y="1150" class="formula">uᵢ₁</text>
  <text x="335" y="1105" class="formula">R</text>
  <circle cx="760" cy="1140" r="10" class="node"/>
  <text x="720" y="1110" class="formula">N</text>

  <!-- non-inverting input -->
  <path d="M150 1270 L245 1270" class="wire"/>
  <path d="M245 1270 l18 -18 l36 36 l36 -36 l36 36 l18 -18" class="wire"/>
  <path d="M425 1270 L760 1270" class="positive"/>
  <text x="95" y="1280" class="formula">uᵢ₂</text>
  <text x="335" y="1235" class="formula">R</text>
  <circle cx="760" cy="1270" r="10" class="node"/>
  <text x="720" y="1240" class="formula">P</text>

  <!-- Rf1 feedback -->
  <path d="M1090 1200 L1410 1200" class="wire"/>
  <text x="1435" y="1210" class="formula">uₒ</text>
  <path d="M1250 1200 L1250 1040 L1150 1040" class="feedback"/>
  <path d="M1150 1040 l-18 -18 l-36 36 l-36 -36 l-36 36 l-18 -18" class="feedback"/>
  <path d="M970 1040 L650 1040 L650 1140 L760 1140" class="feedback"/>
  <text x="1050" y="1015" class="formula purple">R_f</text>

  <!-- Rf2 to ground -->
  <path d="M760 1270 L760 1350" class="wire"/>
  <path d="M760 1350 l18 -18 l36 36 l36 -36 l18 18" class="wire"/>
  <path d="M870 1350 L870 1380" class="wire"/>
  <path d="M845 1380 L895 1380 M853 1395 L887 1395 M861 1410 L879 1410" class="wire"/>
  <text x="925" y="1375" class="formula">R_f</text>

  <text x="1600" y="1125" class="formula">u_P = u₂·R_f/(R+R_f)</text>
  <text x="1600" y="1185" class="formula">u_N = (u₁/R + uₒ/R_f)(R∥R_f)</text>
  <text x="1600" y="1245" class="formula">u_N ≈ u_P</text>
  <text x="1600" y="1315" class="formula red">uₒ = (R_f/R)(u₂ − u₁)</text>
  <text x="1600" y="1375" class="small">同一比例关系保证共模抑制：R_f1/R₁ = R_f2/R₂</text>
</svg>
