<text x="835" y="665" font-size="27" fill="#17212b">−VEE</text>
<text x="550" y="530" font-size="25" fill="#175fa0">VEQ</text>
<text x="215" y="585" font-size="24" fill="#17212b">两管匹配且都在放大区</text>
<text x="1010" y="585" font-size="25" fill="#17212b">VCQ1 = VCQ2</text>
<text x="1010" y="630" font-size="25" fill="#175fa0">RL 的直流电流为零</text>
<text x="80" y="770" font-size="30" fill="#17212b">IBQ = (VEE − VBEQ) / [Rb + 2(1+β)RE]；ICQ = βIBQ</text>
<text x="80" y="835" font-size="29" fill="#17212b">VEQ = −VEE + 2(1+β)IBQ RE；VCQ = VCC − ICQ RC</text>
<text x="80" y="900" font-size="28" fill="#17212b">VCEQ = VCQ − VEQ = VCC + VEE − ICQ RC − 2(1+β)IBQ RE</text>
<text x="80" y="975" font-size="27" fill="#175fa0">uo,Q = VCQ1 − VCQ2 = 0；但每个集电极对地电位通常不为零。</text>
<text x="80" y="1045" font-size="25" fill="#17212b">检查两管集电结反偏：VCQ &gt; VBQ；不能把“负载无电流”推广到失配情况。</text>
