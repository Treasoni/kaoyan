<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <rect width="1600" height="950" fill="#fffdf8"/>
  <style>
    text { font-family: "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #20242a; }
    .title { font-size: 42px; font-weight: 700; }
    .label { font-size: 30px; }
    .small { font-size: 25px; }
    .wire { stroke: #20242a; stroke-width: 6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .feedback { stroke: #6d48a8; stroke-width: 8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .current { stroke: #d94b4b; stroke-width: 7; fill: none; marker-end: url(#arrow); }
    .node { fill: #20242a; }
    .box { fill: #ffffff; stroke: #c9ced6; stroke-width: 3; rx: 24; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#d94b4b"/>
    </marker>
  </defs>

  <text x="70" y="70" class="title">同相比例运算：电压串联负反馈与偏置电流补偿</text>
  <rect x="55" y="110" width="1040" height="775" class="box"/>
  <text x="95" y="165" class="label">标准拓扑</text>

  <!-- op amp -->
  <polygon points="610,315 610,655 965,485" fill="#f7f9fc" stroke="#20242a" stroke-width="7"/>
  <text x="635" y="405" class="label">−</text>
  <text x="635" y="590" class="label">+</text>
  <text x="805" y="500" class="label">A</text>

  <!-- non-inverting input branch: ui-Rs-Rb-P -->
  <line x1="90" y1="575" x2="185" y2="575" class="wire"/>
  <rect x="185" y="545" width="145" height="60" fill="#fff" stroke="#20242a" stroke-width="6"/>
  <line x1="330" y1="575" x2="385" y2="575" class="wire"/>
  <rect x="385" y="545" width="145" height="60" fill="#fff" stroke="#20242a" stroke-width="6"/>
  <line x1="530" y1="575" x2="610" y2="575" class="wire"/>
  <text x="90" y="535" class="label">u<tspan baseline-shift="sub" font-size="21">i</tspan></text>
  <text x="230" y="530" class="label">R<tspan baseline-shift="sub" font-size="21">s</tspan></text>
  <text x="430" y="530" class="label">R<tspan baseline-shift="sub" font-size="21">b</tspan></text>
  <text x="548" y="620" class="small">P：u<tspan baseline-shift="sub" font-size="18">P</tspan>≈u<tspan baseline-shift="sub" font-size="18">i</tspan></text>

  <!-- output -->
  <line x1="965" y1="485" x2="1040" y2="485" class="wire"/>
  <circle cx="1040" cy="485" r="9" class="node"/>
  <text x="985" y="450" class="label">u<tspan baseline-shift="sub" font-size="21">o</tspan></text>

  <!-- feedback Rf from output to N -->
  <path d="M1040 485 L1040 225 L855 225" class="feedback"/>
  <rect x="665" y="195" width="190" height="60" fill="#fff" stroke="#6d48a8" stroke-width="6"/>
  <path d="M665 225 L520 225 L520 390 L610 390" class="feedback"/>
  <circle cx="520" cy="390" r="9" class="node"/>
  <text x="725" y="180" class="label" fill="#6d48a8">R<tspan baseline-shift="sub" font-size="21">f</tspan></text>
  <text x="535" y="370" class="small">N：u<tspan baseline-shift="sub" font-size="18">N</tspan>≈u<tspan baseline-shift="sub" font-size="18">i</tspan></text>

  <!-- R from N to ground, routed left to avoid crossing the P input -->
  <line x1="520" y1="390" x2="430" y2="390" class="wire"/>
  <rect x="255" y="360" width="175" height="60" fill="#fff" stroke="#20242a" stroke-width="6"/>
  <line x1="255" y1="390" x2="180" y2="390" class="wire"/>
  <line x1="180" y1="390" x2="180" y2="455" class="wire"/>
  <line x1="140" y1="455" x2="220" y2="455" class="wire"/>
  <line x1="152" y1="475" x2="208" y2="475" class="wire"/>
  <line x1="165" y1="495" x2="195" y2="495" class="wire"/>
  <text x="325" y="345" class="label">R</text>

  <!-- current arrows -->
  <path d="M960 295 L875 295" class="current"/>
  <text x="900" y="275" class="small" fill="#d94b4b">I</text>
  <path d="M455 330 L350 330" class="current"/>
  <text x="395" y="310" class="small" fill="#d94b4b">I</text>
  <text x="225" y="665" class="small" fill="#d94b4b">i<tspan baseline-shift="sub" font-size="18">P</tspan>≈0 ⇒ R<tspan baseline-shift="sub" font-size="18">s</tspan>、R<tspan baseline-shift="sub" font-size="18">b</tspan> 理想无压降</text>

  <!-- formula card -->
  <rect x="1130" y="110" width="415" height="775" class="box"/>
  <text x="1170" y="175" class="label">做题主链</text>
  <text x="1170" y="245" class="small">① 验证负反馈</text>
  <text x="1170" y="310" class="small">② u<tspan baseline-shift="sub" font-size="18">P</tspan>≈u<tspan baseline-shift="sub" font-size="18">i</tspan></text>
  <text x="1170" y="375" class="small">③ u<tspan baseline-shift="sub" font-size="18">N</tspan>≈u<tspan baseline-shift="sub" font-size="18">P</tspan></text>
  <text x="1170" y="440" class="small">④ N 点列 KCL</text>
  <line x1="1170" y1="480" x2="1505" y2="480" stroke="#c9ced6" stroke-width="3"/>
  <text x="1170" y="545" class="label">A<tspan baseline-shift="sub" font-size="21">u</tspan>=1+R<tspan baseline-shift="sub" font-size="21">f</tspan>/R</text>
  <text x="1170" y="615" class="label">R<tspan baseline-shift="sub" font-size="21">i</tspan>→∞（理想）</text>
  <text x="1170" y="690" class="small">R<tspan baseline-shift="sub" font-size="18">s</tspan>+R<tspan baseline-shift="sub" font-size="18">b</tspan></text>
  <text x="1200" y="735" class="small">≈ R ∥ R<tspan baseline-shift="sub" font-size="18">f</tspan></text>
  <text x="1170" y="810" class="small" fill="#d94b4b">N 点不是虚地</text>
</svg>
