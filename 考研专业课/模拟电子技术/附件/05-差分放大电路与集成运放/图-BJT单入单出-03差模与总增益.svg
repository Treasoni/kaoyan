<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#175fa0"/></marker></defs>
<rect width="1600" height="1120" fill="white"/><g font-family="Arial, PingFang SC, sans-serif">
<text x="65" y="65" font-size="36" fill="#17212b">单端输入、单端输出：差模分量与总增益</text>
<text x="65" y="106" font-size="23" fill="#51606d">纯差模半电路与实际单端输入必须区分。D = Rb+rbe，a = (1+β)RE，R′ = RC ∥ RL。</text>
<rect x="50" y="140" width="905" height="380" rx="16" fill="#f8fbfe" stroke="#c7d8e5" stroke-width="2"/>
<rect x="980" y="140" width="565" height="380" rx="16" fill="#f8fbfe" stroke="#c7d8e5" stroke-width="2"/>
<text x="80" y="182" font-size="25" fill="#17212b">左侧差模输入 +uid/2；右侧为 −uid/2</text>
<line x1="100" y1="235" x2="175.0" y2="235" stroke="#17212b" stroke-width="3" />
<line x1="255.0" y1="235" x2="330" y2="235" stroke="#17212b" stroke-width="3" />
<rect x="175.0" y="221" width="80" height="28" fill="white" stroke="#17212b" stroke-width="3"/>
<text x="190.0" y="210" font-size="25" fill="#17212b">Rb</text>
<line x1="330" y1="235" x2="330" y2="307.5" stroke="#17212b" stroke-width="3" />
<line x1="330" y1="377.5" x2="330" y2="450" stroke="#17212b" stroke-width="3" />
<rect x="316" y="307.5" width="28" height="70" fill="white" stroke="#17212b" stroke-width="3"/>
<text x="353" y="350.5" font-size="25" fill="#17212b">rbe</text>
<line x1="330" y1="450" x2="535" y2="450" stroke="#17212b" stroke-width="3" />
<line x1="535" y1="235" x2="535" y2="302.5" stroke="#17212b" stroke-width="3" />
<line x1="535" y1="382.5" x2="535" y2="450" stroke="#17212b" stroke-width="3" />
<path d="M535,302.5 L562,342.5 L535,382.5 L508,342.5 Z" fill="white" stroke="#17212b" stroke-width="3"/>
<path d="M535,321.5 L535,363.5" fill="none" stroke="#175fa0" stroke-width="3" marker-end="url(#arr)"/>
<text x="572" y="350.5" font-size="25" fill="#17212b">βib</text>
<line x1="535" y1="235" x2="855" y2="235" stroke="#17212b" stroke-width="3" />
<line x1="735" y1="235" x2="735" y2="307.5" stroke="#17212b" stroke-width="3" />
<line x1="735" y1="377.5" x2="735" y2="450" stroke="#17212b" stroke-width="3" />
<rect x="721" y="307.5" width="28" height="70" fill="white" stroke="#17212b" stroke-width="3"/>
<text x="758" y="350.5" font-size="25" fill="#17212b">RC</text>
<line x1="855" y1="235" x2="855" y2="307.5" stroke="#17212b" stroke-width="3" />
<line x1="855" y1="377.5" x2="855" y2="450" stroke="#17212b" stroke-width="3" />
<rect x="841" y="307.5" width="28" height="70" fill="white" stroke="#17212b" stroke-width="3"/>
<text x="878" y="350.5" font-size="25" fill="#17212b">RL</text>
<line x1="100" y1="450" x2="855" y2="450" stroke="#17212b" stroke-width="3" />
<line x1="80" y1="450" x2="120" y2="450" stroke="#17212b" stroke-width="3" />
<line x1="87" y1="458" x2="113" y2="458" stroke="#17212b" stroke-width="3" />
<line x1="94" y1="466" x2="106" y2="466" stroke="#17212b" stroke-width="3" />
<line x1="515" y1="450" x2="555" y2="450" stroke="#17212b" stroke-width="3" />
<line x1="522" y1="458" x2="548" y2="458" stroke="#17212b" stroke-width="3" />
<line x1="529" y1="466" x2="541" y2="466" stroke="#17212b" stroke-width="3" />
<circle cx="330" cy="450" r="5" fill="#17212b"/>
<circle cx="535" cy="450" r="5" fill="#17212b"/>
<circle cx="735" cy="235" r="5" fill="#17212b"/>
<text x="65" y="215" font-size="28" fill="#17212b">+</text>
<text x="55" y="435" font-size="28" fill="#17212b">−</text>
<text x="80" y="335" font-size="26" fill="#175fa0">uid/2</text>
<text x="290" y="210" font-size="25" fill="#17212b">b</text>
<text x="490" y="210" font-size="25" fill="#17212b">c</text>
<text x="290" y="490" font-size="25" fill="#17212b">e</text>
<text x="895" y="250" font-size="28" fill="#17212b">+</text>
<text x="885" y="295" font-size="25" fill="#175fa0">uo1</text>
<text x="895" y="450" font-size="28" fill="#17212b">−</text>
<path d="M300,285 L300,330" fill="none" stroke="#175fa0" stroke-width="3" marker-end="url(#arr)"/>
<text x="255" y="315" font-size="22" fill="#175fa0">ib</text>
<text x="1010" y="200" font-size="23" fill="#17212b">纯差模：ue = 0</text>
<text x="1010" y="265" font-size="23" fill="#17212b">ib1 = uid/(2D)</text>
<text x="1010" y="330" font-size="23" fill="#17212b">Aud1 = −βR′/(2D)</text>
<text x="1010" y="405" font-size="23" fill="#17212b">RL 到地，不折算为 RL/2。</text>
<text x="1010" y="468" font-size="23" fill="#17212b">输入侧可用对称性，输出侧不对称。</text>
<rect x="50" y="555" width="1495" height="485" rx="16" fill="#f8fbfe" stroke="#c7d8e5" stroke-width="2"/>
<text x="80" y="604" font-size="30" fill="#17212b">实际单端输入：(ui, 0) = (ui/2, ui/2) + (ui/2, −ui/2)</text>
<text x="80" y="670" font-size="29" fill="#17212b">uid = ui；uic = ui/2</text>
<text x="80" y="735" font-size="31" fill="#17212b">uo = Aud1 · ui + Auc1 · ui/2</text>
<text x="80" y="807" font-size="33" fill="#175fa0">Au = Aud1 + Auc1/2 = −βR′(D+a) / [D(D+2a)]</text>
<text x="80" y="882" font-size="27" fill="#17212b">只有 a ≫ D 时，Au ≈ Aud1；有限尾阻下共模项仍然存在。</text>
<text x="80" y="950" font-size="26" fill="#17212b">输入电阻：Ri,se = D(D+2a)/(D+a)；移除 RL 后，输出电阻 Ro = RC。</text>
<text x="80" y="1010" font-size="27" fill="#17212b">直接验算：uo = −βR′ ii，Au = −βR′/Ri,se，与叠加结果一致。</text>
</g></svg>