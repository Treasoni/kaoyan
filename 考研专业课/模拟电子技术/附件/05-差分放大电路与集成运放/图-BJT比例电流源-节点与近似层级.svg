<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#175fa0"/></marker></defs>
<rect width="1600" height="1120" fill="white"/><g font-family="Arial, PingFang SC, sans-serif">
<text x="65" y="65" font-size="36" fill="#17212b">发射极电阻型比例电流源：先辨节点，再分近似层级</text>
<text x="65" y="106" font-size="23" fill="#51606d">T0 集基短接；两管共基极，但发射极各接自己的电阻。输出端接外部电路，原图未给负载。</text>
<rect x="50" y="145" width="880" height="630" rx="16" fill="#f8fbfe" stroke="#c7d8e5" stroke-width="2"/>
<rect x="960" y="145" width="585" height="630" rx="16" fill="#f8fbfe" stroke="#c7d8e5" stroke-width="2"/>
<line x1="360" y1="185" x2="360" y2="210" stroke="#17212b" stroke-width="3" />
<text x="400" y="190" font-size="26" fill="#17212b">+VCC</text>
<line x1="360" y1="210" x2="360" y2="235.0" stroke="#17212b" stroke-width="3" />
<line x1="360" y1="305.0" x2="360" y2="330" stroke="#17212b" stroke-width="3" />
<rect x="346" y="235.0" width="28" height="70" fill="white" stroke="#17212b" stroke-width="3"/>
<text x="383" y="278.0" font-size="25" fill="#17212b">R</text>
<line x1="360" y1="330" x2="360" y2="345" stroke="#17212b" stroke-width="3" />
