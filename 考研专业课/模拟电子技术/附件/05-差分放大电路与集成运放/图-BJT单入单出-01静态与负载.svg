<text x="65" y="65" font-size="36" fill="#17212b">单端输入、单端输出：静态工作点</text>
<text x="65" y="106" font-size="23" fill="#51606d">左侧 RC 接电源、RL 接地；右管集电极直接接 +VCC。输入源置零后，分别计算两管的 VCEQ。</text>
