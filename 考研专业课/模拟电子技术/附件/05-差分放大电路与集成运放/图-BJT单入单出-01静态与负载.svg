<line x1="1350.0" y1="390" x2="1430" y2="390" stroke="#17212b" stroke-width="3" />
<rect x="1270.0" y="376" width="80" height="28" fill="white" stroke="#17212b" stroke-width="3"/>
<text x="1285.0" y="365" font-size="25" fill="#17212b">Rb</text>
<line x1="130" y1="390" x2="170" y2="390" stroke="#17212b" stroke-width="3" />
<line x1="137" y1="398" x2="163" y2="398" stroke="#17212b" stroke-width="3" />
