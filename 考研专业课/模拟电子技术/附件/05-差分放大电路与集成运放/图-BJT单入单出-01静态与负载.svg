<line x1="714" y1="451" x2="726" y2="451" stroke="#17212b" stroke-width="3" />
<circle cx="460" cy="290" r="5" fill="#17212b"/>
<text x="520" y="270" font-size="25" fill="#175fa0">VCQ1</text>
<text x="815" y="317" font-size="25" fill="#175fa0">+ UoQ</text>
<text x="815" y="430" font-size="25" fill="#17212b">−</text>
<text x="1170" y="260" font-size="25" fill="#175fa0">VCQ2 = VCC</text>
<line x1="460" y1="465" x2="460" y2="500" stroke="#17212b" stroke-width="3" />
<line x1="1120" y1="465" x2="1120" y2="500" stroke="#17212b" stroke-width="3" />
<line x1="460" y1="500" x2="1120" y2="500" stroke="#17212b" stroke-width="3" />
