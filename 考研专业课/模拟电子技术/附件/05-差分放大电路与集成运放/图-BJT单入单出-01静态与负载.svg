<line x1="1417" y1="398" x2="1443" y2="398" stroke="#17212b" stroke-width="3" />
<line x1="1424" y1="406" x2="1436" y2="406" stroke="#17212b" stroke-width="3" />
<text x="120" y="350" font-size="23" fill="#17212b">0 V</text>
<text x="1400" y="350" font-size="23" fill="#17212b">0 V</text>
<line x1="460" y1="290" x2="720" y2="290" stroke="#17212b" stroke-width="3" />
<line x1="720" y1="290" x2="720" y2="327.5" stroke="#17212b" stroke-width="3" />
<line x1="720" y1="397.5" x2="720" y2="435" stroke="#17212b" stroke-width="3" />
<rect x="706" y="327.5" width="28" height="70" fill="white" stroke="#17212b" stroke-width="3"/>
