<line x1="790" y1="620.0" x2="790" y2="670" stroke="#17212b" stroke-width="3" />
<rect x="776" y="550.0" width="28" height="70" fill="white" stroke="#17212b" stroke-width="3"/>
<text x="813" y="593.0" font-size="25" fill="#17212b">RE</text>
<circle cx="790" cy="500" r="5" fill="#17212b"/>
<circle cx="790" cy="670" r="5" fill="#17212b"/>
<text x="835" y="675" font-size="26" fill="#17212b">−VEE</text>
<text x="610" y="545" font-size="25" fill="#175fa0">VEQ</text>
<path d="M420,205 L420,250" fill="none" stroke="#175fa0" stroke-width="3" marker-end="url(#arr)"/>
<text x="370" y="224" font-size="23" fill="#175fa0">IR</text>
<text x="130" y="615" font-size="27" fill="#17212b">IR = ICQ + VCQ1 / RL</text>
<text x="990" y="590" font-size="25" fill="#17212b">两侧集电极电压不相等</text>
<text x="990" y="640" font-size="24" fill="#17212b">输入侧匹配 + 两管在放大区</text>
<text x="990" y="690" font-size="23" fill="#17212b">忽略 Early 效应 → IC1Q = IC2Q</text>
<text x="80" y="795" font-size="29" fill="#17212b">IBQ = (VEE − VBEQ) / [Rb + 2(1+β)RE]；ICQ = βIBQ</text>
<text x="80" y="855" font-size="29" fill="#17212b">VEQ = −VEE + 2(1+β)IBQ RE</text>
<text x="80" y="915" font-size="28" fill="#17212b">VCQ1 = (VCC/RC − ICQ)(RC ∥ RL)；VCEQ1 = VCQ1 − VEQ</text>
<text x="80" y="975" font-size="29" fill="#175fa0">VCEQ2 = VCC − VEQ；UoQ = VCQ1，通常不为零。</text>
<text x="80" y="1045" font-size="26" fill="#17212b">两管均要检查工作区；RL 为直接连接，直流分析时不能移除。</text>
</g></svg>