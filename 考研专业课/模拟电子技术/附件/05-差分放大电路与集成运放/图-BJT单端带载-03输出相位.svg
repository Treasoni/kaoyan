<text x="1000" y="215" font-size="24" fill="#17212b">同侧输入 → 集电极输出反相</text>
<text x="1000" y="275" font-size="24" fill="#17212b">对侧输入 → 集电极输出同相</text>
<text x="1000" y="365" font-size="24" fill="#17212b">左侧带 RL：</text>
<text x="1000" y="410" font-size="24" fill="#17212b">Aud1 = −β(RC ∥ RL) / (2D)</text>
<text x="1000" y="490" font-size="24" fill="#17212b">把同一负载移到右侧：</text>
<text x="1000" y="535" font-size="24" fill="#17212b">Aud2 = +β(RC ∥ RL) / (2D)</text>
<text x="1000" y="605" font-size="24" fill="#17212b">D = Rb + rbe</text>
<text x="1000" y="695" font-size="24" fill="#17212b">若 RL 仍只接左侧：</text>
<text x="1000" y="740" font-size="24" fill="#17212b">右侧 Aud2 = +βRC / (2D)</text>
<text x="1000" y="825" font-size="24" fill="#17212b">反接输出的 + / −，增益变号。</text>
<text x="1000" y="900" font-size="24" fill="#17212b">左右负载不同，幅值不必相等。</text>
<text x="80" y="1040" font-size="26" fill="#17212b">口诀只用于此输出约定与纯差模条件；任意双输入需加上共模响应。</text>
</g></svg>