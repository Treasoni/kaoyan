<text x="1030" y="590" font-size="24" fill="#17212b">输出共模抵消 ≠ 输入无共模</text>
<text x="80" y="750" font-size="29" fill="#175fa0">实际单端输入：Ri,se = ui / ii = D(D+2a)/(D+a) = D + (D ∥ a)</text>
<text x="80" y="798" font-size="27" fill="#17212b">差模跨端口测试：Ri,d = 2D；仅在 a ≫ D 时，Ri,se ≈ Ri,d。</text>
<rect x="50" y="840" width="700" height="225" rx="16" fill="#f8fbfe" stroke="#c7d8e5" stroke-width="2"/>
<rect x="785" y="840" width="760" height="225" rx="16" fill="#f8fbfe" stroke="#c7d8e5" stroke-width="2"/>
<text x="80" y="885" font-size="26" fill="#17212b">有限尾阻的两条输入方程</text>
<text x="80" y="934" font-size="25" fill="#17212b">ui = D ib1 + ue；0 = D ib2 + ue</text>
<text x="80" y="983" font-size="25" fill="#17212b">ue = a(ib1+ib2)</text>
<text x="80" y="1034" font-size="23" fill="#17212b">两式相减可求差模；求 ii 仍要保留 ue。</text>
<text x="815" y="885" font-size="25" fill="#17212b">双端输出电阻：移除 RL，输入源置零</text>
