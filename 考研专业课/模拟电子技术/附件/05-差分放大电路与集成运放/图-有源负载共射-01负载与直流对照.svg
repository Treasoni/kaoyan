<text x="855" y="677" font-size="25" fill="#17212b">VCEQ = VCQ；输出对地取电压</text>
<text x="80" y="790" font-size="29" fill="#17212b">固定 ICQ：RC ↑ → I C Q RC ↑ → VCEQ = VCC − ICQ RC ↓</text>
<text x="80" y="855" font-size="27" fill="#17212b">增大的是电阻压降，不是集电极对地电位；增益比较看绝对值。</text>
<text x="80" y="925" font-size="28" fill="#175fa0">有源负载：动态电阻 roL 可很大，但直流压降不等于 ILQ · roL。</text>
<text x="80" y="991" font-size="29" fill="#17212b">仍需留电压余量：VCE,min &lt; VC &lt; VCC − VL,min</text>
<text x="80" y="1055" font-size="25" fill="#17212b">原图省略偏置与负载参数，不能仅凭此图算出唯一 Q 点或输出摆幅。</text>
