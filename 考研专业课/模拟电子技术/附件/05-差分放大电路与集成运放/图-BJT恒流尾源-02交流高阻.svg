<text x="255" y="315" font-size="22" fill="#175fa0">ib</text>
<text x="1010" y="205" font-size="24" fill="#17212b">直流：保留尾电流 IT</text>
<text x="1010" y="285" font-size="24" fill="#17212b">交流：直流独立电流源置零</text>
<text x="1010" y="350" font-size="24" fill="#17212b">理想尾源 → 开路</text>
<text x="1010" y="415" font-size="24" fill="#17212b">实际尾源 → 留下 rT</text>
<text x="1010" y="495" font-size="24" fill="#17212b">共模半电路的尾阻为 2rT</text>
<text x="1010" y="580" font-size="24" fill="#17212b">理想共模：ib1 = ib2</text>
<text x="1010" y="640" font-size="24" fill="#17212b">且 ib1 + ib2 = 0 → ib = 0</text>
<text x="80" y="795" font-size="29" fill="#17212b">D = Rb+rbe；R′ = RC ∥ RL</text>
<text x="80" y="860" font-size="29" fill="#175fa0">Auc1 = −βR′ / [D + 2(1+β)rT]；rT → ∞ 时 Auc1 → 0</text>
<text x="80" y="925" font-size="28" fill="#17212b">理想共模：ue = uic，但 ube = 0；发射极不是共模虚地。</text>
<text x="80" y="990" font-size="27" fill="#17212b">单端输入：Au = Aud1 + Auc1/2；理想尾源下 Au = Aud1。</text>
<text x="80" y="1050" font-size="24" fill="#17212b">结论限于匹配、小信号、两管放大区且忽略 Early 效应；实际 CMRR 有限。</text>
