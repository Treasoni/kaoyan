<text x="1090" y="650" font-size="24" fill="#17212b">同 VBE + 匹配 → 同 IB、同 IC</text>
<text x="80" y="755" font-size="31" fill="#17212b">IR = (VCC − VBE)/R；IC1 = β IR/(β+2) &lt; IR</text>
<text x="80" y="820" font-size="28" fill="#17212b">T0：VCB0 = 0；T1：检查 Vout &gt; VB（NPN 放大区判据）</text>
<text x="80" y="888" font-size="28" fill="#17212b">PR = IR²R = (VCC − VBE)²/R；不能直接把 IC1 当作 IR。</text>
<text x="80" y="952" font-size="27" fill="#17212b">固定电源和近似固定 VBE：增大 R 会减小参考电流与电阻功耗。</text>
<text x="80" y="1020" font-size="26" fill="#175fa0">等比例镜像不能同时给出 IC0 = 1 μA、IC1 = 1 mA；需另行设计电流比例。</text>
<text x="80" y="1080" font-size="23" fill="#17212b">曲线仅示意，无标定数值；相同 VBE 的结论不能直接推广到不匹配的两只管。</text>
</g></svg>