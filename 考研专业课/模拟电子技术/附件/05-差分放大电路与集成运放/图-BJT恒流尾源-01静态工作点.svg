<text x="1040" y="600" font-size="27" fill="#17212b">IE2Q = IT/2</text>
<text x="80" y="785" font-size="30" fill="#17212b">IBQ = IT / [2(1+β)]；ICQ = βIBQ ≈ IT/2</text>
<text x="80" y="845" font-size="30" fill="#17212b">VEQ = −IBQ Rb − VBEQ</text>
<text x="80" y="905" font-size="27" fill="#17212b">VCQ1 = (VCC/RC − ICQ)(RC ∥ RL)；VCEQ1 = VCQ1 − VEQ</text>
<text x="80" y="965" font-size="28" fill="#17212b">VCEQ2 = VCC − VEQ；尾源两端电压 VTQ = VEQ + VEE</text>
<text x="80" y="1040" font-size="27" fill="#175fa0">先分尾电流，再求节点电位；检查两管放大区和实际尾源的电压余量。</text>
