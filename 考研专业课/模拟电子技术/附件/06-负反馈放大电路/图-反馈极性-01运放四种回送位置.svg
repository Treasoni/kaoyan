<text x="75" y="1040" font-size="30" fill="#17212b">统一判据：反馈使净输入量减小 → 负反馈；使净输入量增大 → 正反馈。</text>
<text x="75" y="1082" font-size="24" fill="#17212b">若 ui 明确为零内阻理想电压源且直接钳位混合节点，Rf 只改变源电流，不能按 C/D 解释。</text>
