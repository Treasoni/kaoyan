<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <!--
    Signal-flow netlist:
    xi -> summer(+); xf -> summer(-); xd -> A(jw) -> xo; xo -> F(jw) -> xf.
    The three right-hand cards assume the loop phase has reached -180 degrees.
  -->
  <defs>
    <marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#1767a6"/>
    </marker>
    <marker id="redArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#c84630"/>
    </marker>
  </defs>

  <rect width="1600" height="1100" fill="#ffffff"/>
  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#172431">
    <text x="52" y="62" font-size="36" font-weight="700">负反馈为什么会自激？——看信号绕一圈以后怎样回来</text>
    <text x="52" y="106" font-size="23" fill="#526372">只补理解自激所需的频率响应：频率改变时，增益大小和相位都会改变。</text>

    <!-- Panel 1: minimum frequency-response intuition -->
    <rect x="35" y="140" width="470" height="525" rx="18" fill="#f5f9fd" stroke="#bad1e4" stroke-width="2"/>
    <text x="62" y="186" font-size="29" font-weight="700">① 不同频率，不同“放大效果”</text>
    <g stroke="#51687a" stroke-width="3" fill="none">
      <path d="M108 445 V245 M108 445 H445"/>
      <path d="M112 405 C155 405 165 335 210 315 C260 293 333 292 365 315 C402 343 412 397 440 404" stroke="#1767a6" stroke-width="5"/>
    </g>
    <text x="58" y="256" font-size="22">|A(jω)|</text>
    <text x="430" y="475" font-size="22">f</text>
    <line x1="205" y1="258" x2="205" y2="448" stroke="#a6b6c2" stroke-width="2" stroke-dasharray="8 8"/>
    <line x1="365" y1="258" x2="365" y2="448" stroke="#a6b6c2" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="122" y="505" font-size="24" fill="#6e4b35">低频</text>
    <text x="255" y="505" font-size="24" fill="#1767a6">中频</text>
    <text x="389" y="505" font-size="24" fill="#6e4b35">高频</text>
    <text x="72" y="552" font-size="22">低频：耦合/旁路电容开始影响</text>
    <text x="72" y="590" font-size="22">中频：增益近似不变，最熟悉</text>
    <text x="72" y="628" font-size="22">高频：结电容、内部极点带来相移</text>

    <!-- Panel 2: feedback loop -->
    <rect x="530" y="140" width="1035" height="525" rx="18" fill="#fffaf5" stroke="#dfc8b1" stroke-width="2"/>
    <text x="558" y="186" font-size="29" font-weight="700">② 信号绕反馈环路一圈</text>
    <g stroke="#172431" stroke-width="3" fill="none">
      <circle cx="665" cy="320" r="34"/>
      <rect x="810" y="270" width="205" height="100" rx="10"/>
      <rect x="840" y="475" width="175" height="88" rx="10"/>
    </g>
    <g stroke="#1767a6" stroke-width="4" fill="none" marker-end="url(#blueArrow)">
      <path d="M565 320 H628"/>
      <path d="M700 320 H803"/>
      <path d="M1018 320 H1180"/>
      <path d="M1125 320 V519 H1022"/>
      <path d="M837 519 H665 V360"/>
    </g>
    <text x="570" y="300" font-size="27">xᵢ</text>
    <text x="638" y="316" font-size="27">＋</text>
    <text x="650" y="354" font-size="27">−</text>
    <text x="728" y="298" font-size="25">x_d</text>
    <text x="845" y="331" font-size="29">A(jω)</text>
    <text x="1046" y="300" font-size="27">xₒ</text>
    <text x="890" y="530" font-size="29">F(jω)</text>
    <text x="686" y="502" font-size="25">x_f</text>
    <text x="1215" y="265" font-size="27">环路增益</text>
    <text x="1215" y="312" font-size="32" fill="#1767a6">T(jω)=A(jω)F(jω)</text>
    <text x="1215" y="378" font-size="24">中频：反馈回来仍在“减小误差”</text>
    <text x="1215" y="423" font-size="24" fill="#c84630">某频率：附加相移达 180°</text>
    <text x="1215" y="463" font-size="24" fill="#c84630">减去反向量 = 实际相加</text>
    <text x="580" y="615" font-size="25">于是原来的负反馈，在该频率上变成了有效的正反馈。</text>

    <!-- Panel 3: decay / sustain / grow -->
    <text x="52" y="725" font-size="29" font-weight="700">③ 已满足相位条件 ∠T=(2k+1)180° 后，再看每绕一圈的大小</text>

    <rect x="35" y="760" width="485" height="240" rx="18" fill="#f3faf6" stroke="#9bc6ac" stroke-width="2"/>
    <text x="65" y="810" font-size="30" fill="#247146">|T| &lt; 1：越绕越小</text>
    <path d="M70 920 C105 845 140 845 175 920 C210 975 245 975 280 920 C315 878 350 878 385 920 C420 948 450 948 485 920" fill="none" stroke="#247146" stroke-width="5"/>
    <text x="65" y="976" font-size="23">扰动逐圈衰减 → 稳定</text>

    <rect x="558" y="760" width="485" height="240" rx="18" fill="#fff9ed" stroke="#d8b66f" stroke-width="2"/>
    <text x="588" y="810" font-size="30" fill="#9a6b13">|T| = 1：一圈刚好补回</text>
    <path d="M593 920 C623 850 653 850 683 920 C713 990 743 990 773 920 C803 850 833 850 863 920 C893 990 923 990 953 920 C973 875 993 875 1010 920" fill="none" stroke="#9a6b13" stroke-width="5"/>
    <text x="588" y="976" font-size="23">等幅持续 → 临界自激条件</text>

    <rect x="1080" y="760" width="485" height="240" rx="18" fill="#fff4f2" stroke="#d79b91" stroke-width="2"/>
    <text x="1110" y="810" font-size="30" fill="#b33b2a">|T| &gt; 1：越绕越大</text>
    <path d="M1110 920 C1135 900 1160 900 1185 920 C1210 950 1235 950 1260 920 C1290 870 1320 870 1350 920 C1385 995 1420 995 1455 920 C1490 825 1525 825 1550 920" fill="none" stroke="#b33b2a" stroke-width="5"/>
    <text x="1110" y="976" font-size="23">扰动增长，最后被非线性限幅</text>

    <text x="52" y="1056" font-size="25" fill="#a84625">重点：不是要求所有频率都有 |AF|&lt;1；应在相位接近 180° 时检查环路增益，或在 |AF|=1 时检查相位裕度。</text>
  </g>
</svg>
