<text x="310" y="1000" font-size="20" fill="#2f7d4f" text-anchor="end" font-weight="normal" font-style="normal">uP = −0.7 V</text>
<text x="238" y="835" font-size="21" fill="#2f7d4f" text-anchor="start" font-weight="normal" font-style="normal">uP = ui</text>
<text x="70" y="1035" font-size="19" fill="#17212b" text-anchor="start" font-weight="normal" font-style="normal">|ui| &lt; 0.7 V：两管截止，R 无电流 ⇒ uP = ui</text>
<text x="70" y="1070" font-size="19" fill="#17212b" text-anchor="start" font-weight="normal" font-style="normal">ui &gt; 0.7 V：D1 导通，uP 钳在 +0.7 V</text>
<text x="70" y="1105" font-size="19" fill="#17212b" text-anchor="start" font-weight="normal" font-style="normal">ui &lt; −0.7 V：D2 导通，uP 钳在 −0.7 V</text>
