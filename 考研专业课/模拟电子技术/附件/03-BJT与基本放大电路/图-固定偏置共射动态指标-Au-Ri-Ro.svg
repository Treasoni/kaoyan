<text x="282.0" y="262" font-size="25" font-weight="400" fill="#171717" text-anchor="middle">
<tspan x="282.0" dy="0">Rb</tspan>
</text>
  <line class="wire" x1="132" y1="408" x2="132" y2="484"/>
  <line class="wire" x1="132" y1="484" x2="636" y2="484"/>
  <line class="wire" x1="390" y1="484" x2="390" y2="502"/>
<line class="wire" x1="362" y1="502" x2="418" y2="502"/>
<line class="wire" x1="372" y1="514" x2="408" y2="514"/>
