<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .wire { stroke:#111827; stroke-width:4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .bluewire { stroke:#2563eb; stroke-width:4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .redwire { stroke:#dc2626; stroke-width:4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .comp { stroke:#111827; stroke-width:4; fill:#fffef9; }
      .panel { fill:#fffdf7; stroke:#d4d4d8; stroke-width:2; }
      .badge { fill:#eef2ff; stroke:#6366f1; stroke-width:2; }
      .formula { fill:#f8fafc; stroke:#cbd5e1; stroke-width:2; }
      .note { fill:#fff7ed; stroke:#fb923c; stroke-width:2; }
    </style>
  </defs>
  <rect width="1600" height="1200" fill="#fffdf7"/>
  <rect x="44" y="38" width="1512" height="96" rx="14" fill="#0f172a"/>
  <text x="80" y="100" font-size="42" font-weight="700" fill="#ffffff" text-anchor="start">
<tspan x="80" dy="0">固定偏置共射动态指标：Au / Ri / Ro</tspan>
</text>
  <text x="900" y="97" font-size="28" font-weight="500" fill="#dbeafe" text-anchor="start">
<tspan x="900" dy="0">按手写图端口：ui 从 Rb 左端加入</tspan>
</text>

  <rect class="panel" x="54" y="166" width="724" height="424" rx="14"/>
  <rect class="badge" x="82" y="192" width="276" height="48" rx="24"/>
  <text x="104" y="225" font-size="27" font-weight="700" fill="#312e81" text-anchor="start">
<tspan x="104" dy="0">1  电压放大倍数</tspan>
</text>
  <circle class="comp" cx="132" cy="374" r="34"/>
<text x="123" y="327" font-size="28" font-weight="700" fill="#171717" text-anchor="start">
<tspan x="123" dy="0">+</tspan>
</text>
<text x="125" y="440" font-size="28" font-weight="700" fill="#171717" text-anchor="start">
<tspan x="125" dy="0">-</tspan>
</text>
<text x="74" y="383" font-size="27" font-weight="400" fill="#171717" text-anchor="start">
<tspan x="74" dy="0">ui</tspan>
</text>
  <line class="wire" x1="132" y1="340" x2="132" y2="296"/>
  <line class="wire" x1="132" y1="296" x2="196" y2="296"/>
