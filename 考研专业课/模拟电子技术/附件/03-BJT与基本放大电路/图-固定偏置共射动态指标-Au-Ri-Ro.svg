<text x="448" y="398.0" font-size="25" font-weight="400" fill="#171717" text-anchor="start">
<tspan x="448" dy="0">rbe</tspan>
</text>
  <line class="wire" x1="414" y1="296" x2="520" y2="296"/>
  <line class="wire" x1="520" y1="296" x2="520" y2="248"/>
  <line class="wire" x1="520" y1="248" x2="636" y2="248"/>
  <line class="wire" x1="636" y1="248" x2="636" y2="324.0"/>
<rect class="comp" x="614" y="324.0" width="44" height="84" rx="8"/>
