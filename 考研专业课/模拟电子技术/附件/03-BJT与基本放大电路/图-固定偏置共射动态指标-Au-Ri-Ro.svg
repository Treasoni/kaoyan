<text x="670" y="374.0" font-size="25" font-weight="400" fill="#171717" text-anchor="start">
<tspan x="670" dy="0">RC</tspan>
</text>
  <polygon class="comp" points="520,320 566,366 520,412 474,366"/>
<line class="bluewire" x1="520" y1="338" x2="520" y2="392" marker-end="url(#arrow)"/>
<text x="578" y="374" font-size="25" font-weight="400" fill="#171717" text-anchor="start">
<tspan x="578" dy="0">β ib</tspan>
</text>
  <line class="wire" x1="520" y1="412" x2="520" y2="484"/>
  <line class="wire" x1="636" y1="248" x2="702" y2="248"/>
  <text x="708" y="256" font-size="25" font-weight="700" fill="#dc2626" text-anchor="start">
<tspan x="708" dy="0">+ uo</tspan>
</text>
  <line class="wire" x1="702" y1="248" x2="702" y2="484"/>
  <text x="370" y="272" font-size="25" font-weight="700" fill="#2563eb" text-anchor="start">
<tspan x="370" dy="0">ib →</tspan>
</text>
  <rect class="formula" x="82" y="510" width="650" height="62" rx="10"/>
  <text x="106" y="537" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">
<tspan x="106" dy="0">ui = ib(Rb + rbe)，uo = -β ib RC</tspan>
</text>
  <text x="106" y="566" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">
<tspan x="106" dy="0">Au = uo/ui = -βRC/(Rb+rbe)</tspan>
</text>

  <rect class="panel" x="822" y="166" width="724" height="424" rx="14"/>
  <rect class="badge" x="850" y="192" width="224" height="48" rx="24"/>
  <text x="872" y="225" font-size="27" font-weight="700" fill="#312e81" text-anchor="start">
<tspan x="872" dy="0">2  输入电阻</tspan>
</text>
  <text x="870" y="288" font-size="26" font-weight="500" fill="#171717" text-anchor="start">
<tspan x="870" dy="0">从输入端向右看，把内部复杂电路等效成一个电阻 Ri。</tspan>
</text>
  <line class="bluewire" x1="900" y1="366" x2="1110" y2="366" marker-end="url(#arrow)"/>
  <text x="892" y="344" font-size="28" font-weight="700" fill="#2563eb" text-anchor="start">
<tspan x="892" dy="0">I</tspan>
</text>
  <circle class="comp" cx="910" cy="416" r="34"/>
<text x="901" y="369" font-size="28" font-weight="700" fill="#171717" text-anchor="start">
<tspan x="901" dy="0">+</tspan>
</text>
<text x="903" y="482" font-size="28" font-weight="700" fill="#171717" text-anchor="start">
<tspan x="903" dy="0">-</tspan>
</text>
<text x="852" y="425" font-size="27" font-weight="400" fill="#171717" text-anchor="start">
<tspan x="852" dy="0">U</tspan>
</text>
  <line class="wire" x1="944" y1="416" x2="1018" y2="416"/>
  <line class="wire" x1="1018" y1="416" x2="1077.0" y2="416"/>
<rect class="comp" x="1077.0" y="394" width="100" height="44" rx="8"/>
<line class="wire" x1="1177.0" y1="416" x2="1236" y2="416"/>
<text x="1127.0" y="382" font-size="25" font-weight="400" fill="#171717" text-anchor="middle">
<tspan x="1127.0" dy="0">Ri = Rb + rbe</tspan>
</text>
  <line class="wire" x1="1236" y1="416" x2="1302" y2="416"/>
  <line class="wire" x1="1302" y1="416" x2="1302" y2="458"/>
  <line class="wire" x1="910" y1="450" x2="910" y2="458"/>
  <line class="wire" x1="910" y1="458" x2="1302" y2="458"/>
  <rect class="formula" x="850" y="510" width="656" height="56" rx="10"/>
  <text x="878" y="546" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">
<tspan x="878" dy="0">Ri = U/I = Rb + rbe（按本图端口定义）</tspan>
</text>

  <rect class="panel" x="54" y="632" width="724" height="426" rx="14"/>
  <rect class="badge" x="82" y="658" width="268" height="48" rx="24"/>
  <text x="104" y="691" font-size="27" font-weight="700" fill="#312e81" text-anchor="start">
<tspan x="104" dy="0">3  开路输出电压</tspan>
</text>
  <text x="94" y="754" font-size="26" font-weight="500" fill="#171717" text-anchor="start">
<tspan x="94" dy="0">负载断开，输入源保留，输出端没有外接负载。</tspan>
</text>
  <line class="wire" x1="196" y1="862" x2="388" y2="862"/>
  <line class="wire" x1="388" y1="862" x2="388" y2="859.0"/>
<rect class="comp" x="366" y="859.0" width="44" height="84" rx="8"/>
<line class="wire" x1="388" y1="943.0" x2="388" y2="940"/>
<text x="422" y="909.0" font-size="25" font-weight="400" fill="#171717" text-anchor="start">
<tspan x="422" dy="0">RC</tspan>
</text>
  <polygon class="comp" points="268,858 314,904 268,950 222,904"/>
<line class="bluewire" x1="268" y1="876" x2="268" y2="930" marker-end="url(#arrow)"/>
<text x="326" y="912" font-size="25" font-weight="400" fill="#171717" text-anchor="start">
<tspan x="326" dy="0">β ib</tspan>
</text>
  <line class="wire" x1="268" y1="858" x2="268" y2="820"/>
  <line class="wire" x1="268" y1="820" x2="388" y2="820"/>
  <line class="wire" x1="268" y1="950" x2="388" y2="950"/>
  <line class="wire" x1="330" y1="950" x2="330" y2="968"/>
<line class="wire" x1="302" y1="968" x2="358" y2="968"/>
<line class="wire" x1="312" y1="980" x2="348" y2="980"/>
<line class="wire" x1="322" y1="992" x2="338" y2="992"/>
  <text x="424" y="828" font-size="25" font-weight="700" fill="#dc2626" text-anchor="start">
<tspan x="424" dy="0">+ Uoc</tspan>
</text>
  <text x="424" y="948" font-size="25" font-weight="700" fill="#dc2626" text-anchor="start">
<tspan x="424" dy="0">-</tspan>
</text>
  <rect class="formula" x="82" y="980" width="320" height="46" rx="10"/>
  <text x="108" y="1012" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">
<tspan x="108" dy="0">Uoc = -β ib RC</tspan>
</text>
  <text x="468" y="858" font-size="26" font-weight="500" fill="#171717" text-anchor="start">
<tspan x="468" dy="0">开路电压就是戴维南等效源。</tspan>
</text>

  <rect class="panel" x="822" y="632" width="724" height="426" rx="14"/>
  <rect class="badge" x="850" y="658" width="248" height="48" rx="24"/>
  <text x="872" y="691" font-size="27" font-weight="700" fill="#312e81" text-anchor="start">
<tspan x="872" dy="0">4  输出电阻</tspan>
</text>
  <text x="870" y="754" font-size="25" font-weight="600" fill="#171717" text-anchor="start">
<tspan x="870" dy="0">求 Ro：独立源置零，保留受控源。</tspan>
<tspan x="870" dy="33.75">本图中 ib=0，所以受控源为 0。</tspan>
</text>
  <text x="872" y="834" font-size="27" font-weight="700" fill="#dc2626" text-anchor="start">
<tspan x="872" dy="0">ui = 0 ⇒ vb = 0 ⇒ ib = 0 ⇒ βib = 0</tspan>
</text>
  <line class="wire" x1="936" y1="960" x2="1068" y2="960"/>
  <line class="wire" x1="1068" y1="888" x2="1068" y2="912.0"/>
<rect class="comp" x="1046" y="912.0" width="44" height="84" rx="8"/>
<line class="wire" x1="1068" y1="996.0" x2="1068" y2="1020"/>
<text x="1102" y="962.0" font-size="25" font-weight="400" fill="#171717" text-anchor="start">
<tspan x="1102" dy="0">RC</tspan>
</text>
  <line class="wire" x1="936" y1="1020" x2="1234" y2="1020"/>
  <line class="wire" x1="1000" y1="1020" x2="1000" y2="1038"/>
<line class="wire" x1="972" y1="1038" x2="1028" y2="1038"/>
<line class="wire" x1="982" y1="1050" x2="1018" y2="1050"/>
<line class="wire" x1="992" y1="1062" x2="1008" y2="1062"/>
  <circle class="comp" cx="1234" cy="968" r="34"/>
<text x="1225" y="921" font-size="28" font-weight="700" fill="#171717" text-anchor="start">
<tspan x="1225" dy="0">+</tspan>
</text>
<text x="1227" y="1034" font-size="28" font-weight="700" fill="#171717" text-anchor="start">
<tspan x="1227" dy="0">-</tspan>
</text>
<text x="1176" y="977" font-size="27" font-weight="400" fill="#171717" text-anchor="start">
<tspan x="1176" dy="0">U</tspan>
</text>
  <line class="wire" x1="1234" y1="934" x2="1234" y2="888"/>
  <line class="wire" x1="1068" y1="888" x2="1234" y2="888"/>
  <line class="wire" x1="1234" y1="1002" x2="1234" y2="1020"/>
  <line class="bluewire" x1="1234" y1="858" x2="1128" y2="858" marker-end="url(#arrow)"/>
  <text x="1210" y="848" font-size="28" font-weight="700" fill="#2563eb" text-anchor="start">
<tspan x="1210" dy="0">I</tspan>
</text>
  <rect class="formula" x="850" y="886" width="286" height="46" rx="10"/>
  <text x="876" y="918" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">
<tspan x="876" dy="0">Ro = U/I = RC</tspan>
</text>

  <rect x="54" y="1128" width="1492" height="42" rx="8" fill="#eef2ff"/>
  <text x="80" y="1156" font-size="23" font-weight="700" fill="#312e81" text-anchor="start">
<tspan x="80" dy="0">做题顺序：画微变等效 → 明确输入/输出端口 → 算 Au → 算 Ri → 断开负载、置零独立源、保留受控源求 Ro</tspan>
</text>
</svg>
