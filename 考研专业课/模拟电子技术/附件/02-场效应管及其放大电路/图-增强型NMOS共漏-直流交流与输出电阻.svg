<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="920" viewBox="0 0 1800 920">
  <style>
    .wire{stroke:#18212b;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#18212b;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.dc{stroke:#c0392b;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.ac{stroke:#2471a3;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#fbfcfd;stroke:#bac6d2;stroke-width:2}.title{font:700 33px 'Noto Sans CJK SC','PingFang SC',sans-serif;fill:#18212b}.subtitle{font:700 23px 'Noto Sans CJK SC','PingFang SC',sans-serif;fill:#18212b}.label{font:22px 'Noto Sans CJK SC','PingFang SC',sans-serif;fill:#18212b}.small{font:18px 'Noto Sans CJK SC','PingFang SC',sans-serif;fill:#52606d}.redtext{font:20px 'Noto Sans CJK SC','PingFang SC',sans-serif;fill:#c0392b}.bluetext{font:20px 'Noto Sans CJK SC','PingFang SC',sans-serif;fill:#2471a3}
  </style>
  <rect width="1800" height="920" fill="#fff"/>
  <text x="900" y="54" text-anchor="middle" class="title">增强型 NMOS 共漏极（源极跟随器）：直流、交流与输出电阻</text>

  <rect x="35" y="84" width="535" height="790" rx="18" class="panel"/>
  <text x="302" y="130" text-anchor="middle" class="subtitle">直流：求 VGSQ、IDQ、VDSQ</text>
  <text x="72" y="168" class="small">网表：VDD—D；S—RS—地；VGG—RG—G</text>
  <!-- VDD and MOS -->
  <text x="352" y="213" class="label">V<tspan baseline-shift="sub" font-size="15">DD</tspan></text><circle cx="340" cy="225" r="5" fill="#18212b"/><path d="M340 225 L340 300" class="wire"/><path d="M312 314 L312 438" class="thin"/><path d="M340 300 L340 314" class="wire"/><path d="M275 375 L300 375" class="wire"/><path d="M300 346 L300 404" class="thin"/><path d="M340 438 L340 480" class="wire"/><text x="355" y="305" class="label">D</text><text x="355" y="462" class="label">S</text><text x="250" y="352" class="label">G</text>
  <!-- source resistor -->
  <path d="M340 480 L340 510" class="wire"/><path d="M340 510 L328 523 L352 537 L328 551 L352 565 L328 579 L352 593 L340 606" class="wire"/><text x="365" y="566" class="label">R<tspan baseline-shift="sub" font-size="15">S</tspan></text><path d="M340 606 L340 650" class="wire"/><path d="M308 650 L372 650 M317 661 L363 661 M327 672 L353 672" class="wire"/>
  <!-- gate bias VGG and RG -->
  <path d="M98 375 L150 375" class="wire"/><path d="M150 375 L163 363 L177 387 L191 363 L205 387 L219 363 L233 387 L246 375" class="wire"/><text x="160" y="340" class="label">R<tspan baseline-shift="sub" font-size="15">G</tspan></text><path d="M246 375 L275 375" class="wire"/><path d="M98 375 L98 455" class="wire"/><path d="M80 455 L116 455 M88 466 L108 466" class="thin"/><path d="M98 466 L98 550" class="wire"/><path d="M98 550 L340 550" class="wire"/><text x="48" y="507" class="label">V<tspan baseline-shift="sub" font-size="15">GG</tspan></text>
  <path d="M290 375 L290 480" class="dc"/><path d="M282 382 L290 375 L298 382 M282 473 L290 480 L298 473" class="dc"/><text x="180" y="443" class="redtext">V<tspan baseline-shift="sub" font-size="14">GSQ</tspan></text><path d="M390 300 L390 480" class="dc"/><path d="M382 307 L390 300 L398 307 M382 473 L390 480 L398 473" class="dc"/><text x="405" y="396" class="redtext">V<tspan baseline-shift="sub" font-size="14">DSQ</tspan></text>
  <text x="75" y="733" class="redtext">V<tspan baseline-shift="sub" font-size="14">GSQ</tspan>=V<tspan baseline-shift="sub" font-size="14">GG</tspan>−I<tspan baseline-shift="sub" font-size="14">DQ</tspan>R<tspan baseline-shift="sub" font-size="14">S</tspan></text><text x="75" y="770" class="redtext">I<tspan baseline-shift="sub" font-size="14">DQ</tspan>=K<tspan baseline-shift="sub" font-size="14">n</tspan>(V<tspan baseline-shift="sub" font-size="14">GSQ</tspan>−V<tspan baseline-shift="sub" font-size="14">TN</tspan>)²</text><text x="75" y="807" class="redtext">V<tspan baseline-shift="sub" font-size="14">DSQ</tspan>=V<tspan baseline-shift="sub" font-size="14">DD</tspan>−I<tspan baseline-shift="sub" font-size="14">DQ</tspan>R<tspan baseline-shift="sub" font-size="14">S</tspan></text><text x="75" y="846" class="small">校验：VDSQ ≥ VGSQ−VTN（恒流区）</text>

  <rect x="632" y="84" width="535" height="790" rx="18" class="panel"/>
  <text x="900" y="130" text-anchor="middle" class="subtitle">中频：源极输出，同相且小于 1</text>
  <text x="665" y="168" class="small">网表：D 为交流地；G 为输入；S—RS—地，输出取 S</text>
  <!-- AC input, transistor and source output -->
  <path d="M692 480 L692 420" class="wire"/><circle cx="692" cy="518" r="38" class="wire"/><path d="M692 480 L692 518 M680 506 L704 506 M692 494 L692 518" class="thin"/><path d="M692 556 L692 650" class="wire"/><path d="M660 650 L724 650 M669 661 L715 661 M679 672 L705 672" class="wire"/><text x="644" y="502" class="bluetext">v<tspan baseline-shift="sub" font-size="14">i</tspan></text>
  <path d="M692 420 L740 420" class="ac"/><path d="M740 420 L753 408 L767 432 L781 408 L795 432 L809 408 L823 432 L836 420" class="wire"/><text x="754" y="388" class="label">R<tspan baseline-shift="sub" font-size="15">G</tspan></text><path d="M836 420 L875 420" class="wire"/><path d="M875 390 L875 450" class="thin"/><path d="M900 285 L900 500" class="thin"/><path d="M875 420 L900 420" class="wire"/><path d="M900 285 L900 250" class="wire"/><path d="M868 250 L932 250 M877 261 L923 261 M887 272 L913 272" class="wire"/><text x="845" y="375" class="label">G</text><text x="915" y="300" class="label">D（交流地）</text>
  <path d="M900 500 L955 500" class="wire"/><path d="M955 500 L955 530" class="wire"/><path d="M955 530 L943 543 L967 557 L943 571 L967 585 L943 599 L967 613 L955 626" class="wire"/><path d="M955 626 L955 650" class="wire"/><text x="978" y="580" class="label">R<tspan baseline-shift="sub" font-size="15">S</tspan></text><path d="M923 650 L987 650 M932 661 L978 661 M942 672 L968 672" class="wire"/>
  <path d="M900 285 L900 330" class="wire"/><path d="M900 330 L930 378 L900 426 L870 378 Z" fill="#eaf3fa" stroke="#2471a3" stroke-width="4"/><path d="M900 350 L900 404 M890 394 L900 404 L910 394" class="ac"/><path d="M900 426 L900 500" class="wire"/><text x="938" y="385" class="bluetext">g<tspan baseline-shift="sub" font-size="14">m</tspan>v<tspan baseline-shift="sub" font-size="14">gs</tspan></text>
  <path d="M1050 500 L1050 650" class="thin"/><path d="M1039 512 L1050 500 L1061 512 M1039 638 L1050 650 L1061 638" class="thin"/><text x="1068" y="580" class="bluetext">v<tspan baseline-shift="sub" font-size="14">o</tspan></text><text x="1018" y="492" class="bluetext">+</text><text x="1018" y="648" class="bluetext">−</text>
  <text x="672" y="735" class="bluetext">A<tspan baseline-shift="sub" font-size="14">v</tspan>=g<tspan baseline-shift="sub" font-size="14">m</tspan>R<tspan baseline-shift="sub" font-size="14">S</tspan>/(1+g<tspan baseline-shift="sub" font-size="14">m</tspan>R<tspan baseline-shift="sub" font-size="14">S</tspan>)</text><text x="672" y="775" class="bluetext">0&lt;A<tspan baseline-shift="sub" font-size="14">v</tspan>&lt;1，v<tspan baseline-shift="sub" font-size="14">o</tspan> 与 v<tspan baseline-shift="sub" font-size="14">i</tspan> 同相</text><text x="672" y="816" class="small">理想 MOS 栅极不取电流：R<tspan baseline-shift="sub" font-size="14">i</tspan>≈∞</text>

  <rect x="1230" y="84" width="535" height="790" rx="18" class="panel"/>
  <text x="1498" y="130" text-anchor="middle" class="subtitle">求 R<tspan baseline-shift="sub" font-size="16">o</tspan>：输入置零，加测试源</text>
  <text x="1262" y="168" class="small">令 vg=0，故 vgs=−v；观察测试电流 i</text>
  <!-- Ro test: gate & drain ground; source test -->
  <path d="M1325 300 L1325 340" class="wire"/><path d="M1293 300 L1357 300 M1302 311 L1348 311 M1312 322 L1338 322" class="wire"/><path d="M1325 340 L1325 415" class="wire"/><path d="M1297 390 L1322 390" class="wire"/><path d="M1322 362 L1322 418" class="thin"/><path d="M1350 340 L1350 500" class="thin"/><path d="M1322 390 L1350 390" class="wire"/><path d="M1350 500 L1450 500" class="wire"/><text x="1280" y="365" class="label">G</text><text x="1368" y="355" class="label">D（地）</text><text x="1368" y="525" class="label">S</text>
  <path d="M1350 340 L1350 375" class="wire"/><path d="M1350 375 L1380 423 L1350 471 L1320 423 Z" fill="#eaf3fa" stroke="#2471a3" stroke-width="4"/><path d="M1350 395 L1350 449 M1340 439 L1350 449 L1360 439" class="ac"/><path d="M1350 471 L1350 500" class="wire"/><text x="1390" y="430" class="bluetext">g<tspan baseline-shift="sub" font-size="14">m</tspan>v<tspan baseline-shift="sub" font-size="14">gs</tspan></text>
  <path d="M1450 500 L1450 530" class="wire"/><path d="M1450 530 L1438 543 L1462 557 L1438 571 L1462 585 L1438 599 L1462 613 L1450 626" class="wire"/><path d="M1450 626 L1450 650" class="wire"/><text x="1473" y="580" class="label">R<tspan baseline-shift="sub" font-size="15">S</tspan></text><path d="M1418 650 L1482 650 M1427 661 L1473 661 M1437 672 L1463 672" class="wire"/>
  <path d="M1545 500 L1545 535" class="wire"/><circle cx="1545" cy="575" r="40" class="thin"/><path d="M1545 535 L1545 575 M1533 563 L1557 563 M1545 551 L1545 575" class="thin"/><path d="M1545 615 L1545 650 L1450 650" class="wire"/><text x="1570" y="580" class="bluetext">v（测试）</text><path d="M1515 500 L1545 500" class="wire"/><path d="M1505 490 L1515 500 L1505 510" class="ac"/><text x="1485" y="480" class="bluetext">i</text>
  <text x="1265" y="735" class="bluetext">v<tspan baseline-shift="sub" font-size="14">gs</tspan>=−v，受控源电流为 g<tspan baseline-shift="sub" font-size="14">m</tspan>v</text><text x="1265" y="775" class="bluetext">R<tspan baseline-shift="sub" font-size="14">o</tspan>′=v/(g<tspan baseline-shift="sub" font-size="14">m</tspan>v)=1/g<tspan baseline-shift="sub" font-size="14">m</tspan></text><text x="1265" y="816" class="bluetext">R<tspan baseline-shift="sub" font-size="14">o</tspan>≈(1/g<tspan baseline-shift="sub" font-size="14">m</tspan>)∥R<tspan baseline-shift="sub" font-size="14">S</tspan></text><text x="1265" y="850" class="small">若计 r<tspan baseline-shift="sub" font-size="14">ds</tspan>，再与 r<tspan baseline-shift="sub" font-size="14">ds</tspan> 并联。</text>
</svg>
