apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: opencli-autofix
  version: 0.1.0
  description: "Automatically fix broken OpenCLI adapters when commands fail. Load this skill when an opencli command fails — it guides you through diagnosing the failure via OPENCLI_DIAGNOSTIC, patching the adapter, retrying, and filin"
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.opencli-autofix
  permissions:
    filesystem: write
    network: allow
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
