apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: json-canvas
  version: 0.1.0
  description: "Create and edit JSON Canvas files (.canvas) with nodes, edges, groups, and connections. Use when working with .canvas files, creating visual canvases, mind maps, flowcharts, or when the user mentions Canvas files in Obsi"
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.json-canvas
  permissions:
    filesystem: write
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
