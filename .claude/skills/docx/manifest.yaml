apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: docx
  version: 0.1.0
  description: "Use this skill whenever the user wants to create, read, edit, or manipulate Word documents (.docx files). Triggers include: any mention of 'Word doc', 'word document', '.docx', or requests to produce professional documen"
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.docx
  permissions:
    filesystem: write
    network: none
    subprocess: allow
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
