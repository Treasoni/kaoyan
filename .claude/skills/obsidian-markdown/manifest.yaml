apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: obsidian-markdown
  version: 0.1.0
  description: "Create and edit Obsidian Flavored Markdown with wikilinks, embeds, callouts, properties, and other Obsidian-specific syntax. Use when working with .md files in Obsidian, or when the user mentions wikilinks, callouts, fro"
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.obsidian-markdown
  permissions:
    filesystem: write
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
