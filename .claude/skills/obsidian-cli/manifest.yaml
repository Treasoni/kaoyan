apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: obsidian-cli
  version: 0.1.0
  description: "Interact with Obsidian vaults using the Obsidian CLI to read, create, search, and manage notes, tasks, properties, and more. Also supports plugin and theme development with commands to reload plugins, run JavaScript, cap"
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.obsidian-cli
  permissions:
    filesystem: write
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
