apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: maintain-learnings
  version: 0.1.0
  description: "维护 .learnings/ 经验库，把过多或反复出现的学习记录、错误日志、规则失效问题聚类诊断，追溯并修改对应 skill、模板、hook、校验脚本或项目规则；修复并验证后再归档或移除已解决记录；同时检查多个 agent skill 目录之间的共享功能同步。用户提到 learnings 太多、错误反复犯、清理经验库、维护自我学习、压缩错误日志、从错误中修技能、同步多 agent 技能时触发。"
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.maintain-learnings
  permissions:
    filesystem: write
    network: none
    subprocess: allow
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
