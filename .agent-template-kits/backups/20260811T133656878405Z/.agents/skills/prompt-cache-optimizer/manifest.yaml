apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: prompt-cache-optimizer
  version: 0.1.0
  description: "审计并优化 LLM 提示缓存命中率、输入 token、延迟与调用成本。用于用户要求“优化缓存命中”“降低 token 成本”“审计 LLM 调用”“提示词缓存优化”“优化 AI 调用费用”，或需要为任意 agent profile 与应用代码建立可观测性和固定回归样本时。"
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.prompt-cache-optimizer
  permissions:
    filesystem: write
    network: none
    subprocess: allow
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
