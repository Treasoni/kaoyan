apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: understanding
  version: 0.1.0
  description: "This skill should be used when the user wants to verify whether their understanding of a concept, derivation, note, screenshot, or worked problem is correct, and expects a structured `[!personal]` understanding record wi"
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.understanding
  permissions:
    filesystem: write
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
