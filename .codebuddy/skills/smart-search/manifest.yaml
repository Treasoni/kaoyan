apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: smart-search
  version: 0.1.0
  description: "基于 opencli 命令的智能搜索路由器。当用户想要搜索、查询、查找或研究信息时，尤其是涉及指定网站、社交媒体、技术资料、新闻、购物、旅游、求职、金融或中文内容时，务必使用此 skill"
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.smart-search
  permissions:
    filesystem: write
    network: allow
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
