apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: pdf
  version: 0.1.0
  description: "Use this skill whenever the user wants to do anything with PDF files. This includes reading or extracting text/tables from PDFs, combining or merging multiple PDFs into one, splitting PDFs apart, rotating pages, adding w"
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.pdf
  permissions:
    filesystem: write
    network: none
    subprocess: allow
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
