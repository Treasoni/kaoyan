<svg xmlns="http://www.w3.org/2000/svg" width="520" height="420" viewBox="0 0 520 420">
  <rect width="100%" height="100%" fill="white"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <line x1="80" y1="340" x2="440" y2="340" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="80" y1="340" x2="80" y2="40" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="345" font-size="18" fill="#333">x</text>
  <text x="70" y="32" font-size="18" fill="#333">y</text>

  <!-- Square [0,1]x[0,1] mapped: (80,340) to (380,40) -->
  <polygon points="80,340 380,340 380,40 80,40" fill="none" stroke="#111" stroke-width="2"/>
  <polygon points="80,340 380,340 380,40" fill="#dbeafe" opacity="0.75"/>
  <polygon points="80,340 380,40 80,40" fill="#fee2e2" opacity="0.75"/>
  <line x1="80" y1="340" x2="380" y2="40" stroke="#111827" stroke-width="3"/>

  <text x="232" y="365" font-size="16" fill="#333">1</text>
  <text x="50" y="47" font-size="16" fill="#333">1</text>
  <text x="64" y="360" font-size="16" fill="#333">0</text>
  <text x="235" y="184" font-size="18" fill="#111827">y=x</text>

  <text x="260" y="245" font-size="18" fill="#1d4ed8">D₁: 0≤y≤x≤1</text>
  <text x="275" y="270" font-size="16" fill="#1d4ed8">max=x²</text>
  <text x="105" y="115" font-size="18" fill="#b91c1c">D₂: 0≤x≤y≤1</text>
  <text x="130" y="140" font-size="16" fill="#b91c1c">max=y²</text>
</svg>
