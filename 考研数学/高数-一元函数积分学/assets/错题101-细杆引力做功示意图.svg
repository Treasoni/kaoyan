<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="245" y="42" font-size="25" font-weight="700" fill="#111827">细杆引力做功：先求 F(x₀)，再对位移积分</text>

  <!-- x-axis -->
  <line x1="90" y1="270" x2="1035" y2="270" stroke="#111827" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="1048" y="278" font-size="22" fill="#111827">x</text>

  <!-- rod [0,1] -->
  <line x1="160" y1="270" x2="520" y2="270" stroke="#2563eb" stroke-width="13" stroke-linecap="round"/>
  <text x="285" y="238" font-size="21" fill="#2563eb">均匀细杆：长度 1，质量 1</text>
  <line x1="160" y1="245" x2="160" y2="295" stroke="#111827" stroke-width="2"/>
  <line x1="520" y1="245" x2="520" y2="295" stroke="#111827" stroke-width="2"/>
  <text x="154" y="320" font-size="20" fill="#111827">0</text>
  <text x="514" y="320" font-size="20" fill="#111827">1</text>

  <!-- rod microelement -->
  <line x1="345" y1="250" x2="380" y2="250" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
  <text x="320" y="215" font-size="19" fill="#ea580c">杆微元 dm=dx</text>
  <text x="356" y="245" font-size="18" fill="#ea580c">x</text>

  <!-- point mass positions -->
  <circle cx="700" cy="270" r="10" fill="#dc2626"/>
  <text x="725" y="238" font-size="20" fill="#dc2626">起点 3/2</text>
  <circle cx="640" cy="270" r="10" fill="#16a34a"/>
  <text x="648" y="344" font-size="20" fill="#16a34a">终点 4/3</text>
  <text x="742" y="298" font-size="20" fill="#dc2626">质点 a</text>

  <!-- distance labels from right endpoint -->
  <line x1="520" y1="210" x2="700" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="580" y="196" font-size="19" fill="#64748b">距右端 1/2</text>
  <line x1="520" y1="360" x2="640" y2="360" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="552" y="390" font-size="19" fill="#64748b">距右端 1/3</text>

  <!-- movement and force arrows -->
  <path d="M695 305 C680 325, 665 325, 645 305" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="655" y="365" font-size="19" fill="#16a34a">位移向左</text>
  <line x1="700" y1="285" x2="610" y2="285" stroke="#dc2626" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="614" y="305" font-size="19" fill="#dc2626">引力向左</text>

  <!-- micro force formula -->
  <line x1="380" y1="250" x2="690" y2="250" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="430" y="175" font-size="20" fill="#111827">r=x₀−x</text>
  <text x="420" y="458" font-size="20" fill="#111827">dF = G·a·dx/(x₀−x)²</text>
  <text x="210" y="488" font-size="20" fill="#111827">F(x₀)=Ga∫₀¹ dx/(x₀−x)² = Ga(1/(x₀−1)−1/x₀)</text>
</svg>
