<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0284c7" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="210" y="42" font-size="25" font-weight="700" fill="#111827">错题97：按你的 y 坐标分段取水平薄条</text>

  <!-- water surface -->
  <line x1="90" y1="100" x2="810" y2="100" stroke="#0ea5e9" stroke-width="4"/>
  <text x="650" y="82" font-size="20" fill="#0284c7">水面：y=d=√2a，深度 h=0</text>

  <!-- square as diamond -->
  <polygon points="450,100 650,300 450,500 250,300" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4" opacity="0.9"/>
  <line x1="450" y1="100" x2="450" y2="500" stroke="#1e40af" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="250" y1="300" x2="650" y2="300" stroke="#1e40af" stroke-width="2" stroke-dasharray="7 7"/>
  <circle cx="450" cy="300" r="6" fill="#ef4444"/>
  <text x="462" y="293" font-size="18" fill="#ef4444">形心 C：y=d/2</text>

  <!-- y axis from bottom upward -->
  <line x1="160" y1="500" x2="160" y2="75" stroke="#111827" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="146" y="65" font-size="22" fill="#111827">y</text>
  <line x1="142" y1="500" x2="178" y2="500" stroke="#111827" stroke-width="2"/>
  <line x1="142" y1="300" x2="178" y2="300" stroke="#111827" stroke-width="2"/>
  <line x1="142" y1="100" x2="178" y2="100" stroke="#111827" stroke-width="2"/>
  <text x="95" y="507" font-size="18" fill="#111827">y=0</text>
  <text x="72" y="307" font-size="18" fill="#111827">y=d/2</text>
  <text x="70" y="107" font-size="18" fill="#111827">y=d</text>

  <!-- guide lines -->
  <line x1="180" y1="500" x2="450" y2="500" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="180" y1="300" x2="650" y2="300" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="180" y1="100" x2="450" y2="100" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- lower strip y in [0,d/2] -->
  <line x1="330" y1="380" x2="570" y2="380" stroke="#dc2626" stroke-width="11" stroke-linecap="round"/>
  <circle cx="330" cy="380" r="4" fill="#dc2626"/>
  <circle cx="570" cy="380" r="4" fill="#dc2626"/>
  <text x="590" y="386" font-size="19" fill="#dc2626">下半：w₂(y)=2y</text>
  <text x="590" y="412" font-size="17" fill="#7f1d1d">0 ≤ y ≤ d/2</text>

  <!-- upper strip y in [d/2,d] -->
  <line x1="370" y1="180" x2="530" y2="180" stroke="#f97316" stroke-width="11" stroke-linecap="round"/>
  <circle cx="370" cy="180" r="4" fill="#f97316"/>
  <circle cx="530" cy="180" r="4" fill="#f97316"/>
  <text x="548" y="186" font-size="19" fill="#ea580c">上半：w₁(y)=2(d−y)</text>
  <text x="548" y="212" font-size="17" fill="#7c2d12">d/2 ≤ y ≤ d</text>

  <!-- bracket for y from bottom to lower strip -->
  <line x1="205" y1="500" x2="205" y2="380" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="205" y1="380" x2="205" y2="500" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="216" y="446" font-size="20" fill="#dc2626">y</text>

  <!-- bracket for depth h=d-y from water to lower strip -->
  <line x1="710" y1="100" x2="710" y2="380" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="710" y1="380" x2="710" y2="100" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="724" y="248" font-size="20" fill="#0284c7">h=d−y</text>

  <!-- diagonal length label -->
  <text x="462" y="520" font-size="19" fill="#1e40af">竖直对角线 d=√2a</text>
  <text x="640" y="315" font-size="18" fill="#1e40af">水平对角线</text>

  <!-- formula box -->
  <rect x="96" y="545" width="708" height="54" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="118" y="578" font-size="20" fill="#111827">微元：dF=ρg(d−y)w(y)dy；分段：上半 w₁=2(d−y)，下半 w₂=2y</text>
</svg>
