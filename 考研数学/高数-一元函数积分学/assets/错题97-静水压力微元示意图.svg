<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" viewBox="0 0 980 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0284c7" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="190" y="42" font-size="26" font-weight="700" fill="#111827">错题97：按手写过程建立的坐标与水平微元</text>

  <!-- coordinate transform note: mathematical (0,d) is upper in SVG y -->
  <!-- Axes -->
  <line x1="120" y1="560" x2="840" y2="560" stroke="#111827" stroke-width="2.4" marker-end="url(#arrow)"/>
  <line x1="120" y1="560" x2="120" y2="90" stroke="#111827" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="852" y="566" font-size="22" fill="#111827">x</text>
  <text x="108" y="78" font-size="22" fill="#111827">y</text>

  <!-- scale marks: d=400 px, origin (120,560), x maps right, y maps up -->
  <line x1="100" y1="560" x2="140" y2="560" stroke="#111827" stroke-width="2"/>
  <line x1="100" y1="360" x2="140" y2="360" stroke="#111827" stroke-width="2"/>
  <line x1="100" y1="160" x2="140" y2="160" stroke="#111827" stroke-width="2"/>
  <line x1="320" y1="540" x2="320" y2="580" stroke="#111827" stroke-width="2"/>
  <line x1="520" y1="540" x2="520" y2="580" stroke="#111827" stroke-width="2"/>
  <text x="75" y="584" font-size="18" fill="#111827">0</text>
  <text x="52" y="366" font-size="18" fill="#111827">d/2</text>
  <text x="78" y="166" font-size="18" fill="#111827">d</text>
  <text x="302" y="608" font-size="18" fill="#111827">d/2</text>
  <text x="514" y="608" font-size="18" fill="#111827">d</text>

  <!-- water surface y=d -->
  <line x1="80" y1="160" x2="885" y2="160" stroke="#0ea5e9" stroke-width="4"/>
  <text x="646" y="140" font-size="20" fill="#0284c7">水面：y=d=√2a</text>

  <!-- diamond vertices: L=(0,d/2), B=(d/2,0), R=(d,d/2), T=(d/2,d) -->
  <polygon points="120,360 320,160 520,360 320,560" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4" opacity="0.92"/>
  <circle cx="120" cy="360" r="5" fill="#1d4ed8"/>
  <circle cx="320" cy="160" r="5" fill="#1d4ed8"/>
  <circle cx="520" cy="360" r="5" fill="#1d4ed8"/>
  <circle cx="320" cy="560" r="5" fill="#1d4ed8"/>
  <text x="135" y="348" font-size="17" fill="#1e40af">(0,d/2)</text>
  <text x="330" y="152" font-size="17" fill="#1e40af">(d/2,d)</text>
  <text x="530" y="365" font-size="17" fill="#1e40af">(d,d/2)</text>
  <text x="330" y="552" font-size="17" fill="#1e40af">(d/2,0)</text>

  <!-- diagonals -->
  <line x1="320" y1="160" x2="320" y2="560" stroke="#1e40af" stroke-width="1.8" stroke-dasharray="7 7"/>
  <line x1="120" y1="360" x2="520" y2="360" stroke="#1e40af" stroke-width="1.8" stroke-dasharray="7 7"/>
  <text x="335" y="382" font-size="18" fill="#1e40af">两条对角线交点：y=d/2</text>

  <!-- side equations -->
  <text x="156" y="240" font-size="18" fill="#7c3aed">上左边：y=x+d/2 ⇒ x₁=y−d/2</text>
  <text x="412" y="240" font-size="18" fill="#7c3aed">上右边：y=−x+3d/2 ⇒ x₂=3d/2−y</text>
  <text x="142" y="482" font-size="18" fill="#059669">下左边：y=−x+d/2 ⇒ x₃=d/2−y</text>
  <text x="395" y="482" font-size="18" fill="#059669">下右边：y=x−d/2 ⇒ x₄=y+d/2</text>

  <!-- upper strip at y=0.75d -> SVG y=260, x1=.25d=220, x2=.75d=420 -->
  <line x1="220" y1="260" x2="420" y2="260" stroke="#f97316" stroke-width="11" stroke-linecap="round"/>
  <line x1="220" y1="260" x2="220" y2="560" stroke="#f97316" stroke-width="1.4" stroke-dasharray="4 5"/>
  <line x1="420" y1="260" x2="420" y2="560" stroke="#f97316" stroke-width="1.4" stroke-dasharray="4 5"/>
  <text x="210" y="250" font-size="18" fill="#ea580c">x₁</text>
  <text x="413" y="250" font-size="18" fill="#ea580c">x₂</text>
  <text x="530" y="262" font-size="19" fill="#ea580c">上半：d/2≤y≤d，宽度 x₂−x₁=2(d−y)</text>

  <!-- lower strip at y=0.25d -> SVG y=460, x3=.25d=220, x4=.75d=420 -->
  <line x1="220" y1="460" x2="420" y2="460" stroke="#dc2626" stroke-width="11" stroke-linecap="round"/>
  <line x1="220" y1="460" x2="220" y2="560" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 5"/>
  <line x1="420" y1="460" x2="420" y2="560" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 5"/>
  <text x="210" y="450" font-size="18" fill="#dc2626">x₃</text>
  <text x="413" y="450" font-size="18" fill="#dc2626">x₄</text>
  <text x="530" y="462" font-size="19" fill="#dc2626">下半：0≤y≤d/2，宽度 x₄−x₃=2y</text>

  <!-- depth bracket h=d-y for an arbitrary lower strip -->
  <line x1="760" y1="160" x2="760" y2="460" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="760" y1="460" x2="760" y2="160" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="775" y="318" font-size="20" fill="#0284c7">水深 h=d−y</text>
  <line x1="420" y1="460" x2="755" y2="460" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 5"/>

  <!-- d definition and formulas -->
  <rect x="85" y="625" width="835" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="106" y="654" font-size="19" fill="#111827">令 d=√2a。上半：P₁=ρg∫[d/2,d](d−y)(x₂−x₁)dy；下半：P₂=ρg∫[0,d/2](d−y)(x₄−x₃)dy</text>
  <text x="106" y="682" font-size="19" fill="#111827">其中 x₂−x₁=2(d−y)，x₄−x₃=2y，这正对应你的草稿分段。</text>
</svg>
