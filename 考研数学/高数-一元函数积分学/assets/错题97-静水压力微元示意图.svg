<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="190" y="36" font-size="24" font-weight="700" fill="#111">正方形平板静水压力微元图</text>

  <!-- water surface -->
  <line x1="90" y1="90" x2="670" y2="90" stroke="#0ea5e9" stroke-width="4"/>
  <text x="580" y="78" font-size="20" fill="#0ea5e9">水面 h=0</text>

  <!-- depth axis -->
  <line x1="105" y1="90" x2="105" y2="455" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="78" y="470" font-size="20" fill="#111">h</text>

  <!-- diamond square -->
  <polygon points="380,90 560,270 380,450 200,270" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="4" opacity="0.82"/>
  <line x1="380" y1="90" x2="380" y2="450" stroke="#1e40af" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="200" y1="270" x2="560" y2="270" stroke="#1e40af" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="390" y="172" font-size="20" fill="#1e40af">竖直对角线 = √2a</text>
  <text x="410" y="268" font-size="20" fill="#1e40af">中心深度 h_c=√2a/2</text>

  <!-- centroid -->
  <circle cx="380" cy="270" r="6" fill="#ef4444"/>
  <text x="390" y="294" font-size="18" fill="#ef4444">形心 C</text>

  <!-- micro strip -->
  <line x1="260" y1="210" x2="500" y2="210" stroke="#dc2626" stroke-width="10" stroke-linecap="round"/>
  <text x="510" y="216" font-size="19" fill="#dc2626">水平薄条：面积 dA = w(h) dh</text>
  <line x1="125" y1="90" x2="370" y2="90" stroke="#94a3b8" stroke-dasharray="5 5"/>
  <line x1="125" y1="210" x2="260" y2="210" stroke="#94a3b8" stroke-dasharray="5 5"/>
  <line x1="135" y1="90" x2="135" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="145" y="158" font-size="20" fill="#64748b">h</text>

  <!-- side length labels -->
  <text x="480" y="178" font-size="20" fill="#111">边长 a</text>
  <text x="482" y="383" font-size="20" fill="#111">边长 a</text>
  <text x="220" y="190" font-size="20" fill="#111">边长 a</text>
  <text x="215" y="382" font-size="20" fill="#111">边长 a</text>

  <!-- formula box -->
  <rect x="96" y="465" width="570" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="115" y="493" font-size="20" fill="#111">静水压力微元：dF = ρg · h · dA；总压力 = ρg · A · h_c</text>
</svg>
