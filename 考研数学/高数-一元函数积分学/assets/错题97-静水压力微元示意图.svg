<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
  <defs>
    <marker id="arrowBlack" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0284c7" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#fff"/>
  <text x="250" y="42" font-size="25" font-weight="700" fill="#111827">按手绘图优化：正方形坐标与水平微元</text>

  <!-- Mathematical mapping: origin O=(150,520), d=360px. x right, y up. -->
  <!-- axes -->
  <line x1="150" y1="520" x2="780" y2="520" stroke="#111827" stroke-width="2.5" marker-end="url(#arrowBlack)"/>
  <line x1="150" y1="560" x2="150" y2="95" stroke="#111827" stroke-width="2.5" marker-end="url(#arrowBlack)"/>
  <text x="792" y="527" font-size="23" fill="#111827">x</text>
  <text x="138" y="82" font-size="23" fill="#111827">y</text>

  <!-- key coordinates -->
  <!-- d = 360, d/2 = 180; vertices: L=(0,d/2), T=(d/2,d), R=(d,d/2), B=(d/2,0) -->
  <!-- coordinates in svg: L(150,340), T(330,160), R(510,340), B(330,520) -->

  <!-- water surface -->
  <line x1="105" y1="160" x2="805" y2="160" stroke="#0ea5e9" stroke-width="4"/>
  <text x="590" y="140" font-size="20" fill="#0284c7">水面：y=d=√2a</text>

  <!-- square -->
  <polygon points="150,340 330,160 510,340 330,520" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4" opacity="0.9"/>
  <circle cx="150" cy="340" r="5" fill="#1d4ed8"/>
  <circle cx="330" cy="160" r="5" fill="#1d4ed8"/>
  <circle cx="510" cy="340" r="5" fill="#1d4ed8"/>
  <circle cx="330" cy="520" r="5" fill="#1d4ed8"/>

  <!-- diagonals exactly like hand sketch -->
  <line x1="330" y1="160" x2="330" y2="520" stroke="#1e40af" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="150" y1="340" x2="510" y2="340" stroke="#1e40af" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="340" y="337" font-size="18" fill="#1e40af">水平对角线</text>
  <text x="340" y="245" font-size="18" fill="#1e40af">竖直对角线</text>

  <!-- side labels a, matching hand drawing -->
  <text x="218" y="236" font-size="22" fill="#111827">a</text>
  <text x="425" y="238" font-size="22" fill="#111827">a</text>
  <path d="M244,246 Q238,224 256,207" fill="none" stroke="#111827" stroke-width="1.6"/>
  <path d="M407,207 Q428,224 421,248" fill="none" stroke="#111827" stroke-width="1.6"/>

  <!-- y-axis brackets: hand sketch shows d/2 below left point and d/2 above it -->
  <line x1="118" y1="520" x2="118" y2="340" stroke="#111827" stroke-width="2"/>
  <line x1="108" y1="520" x2="128" y2="520" stroke="#111827" stroke-width="2"/>
  <line x1="108" y1="340" x2="128" y2="340" stroke="#111827" stroke-width="2"/>
  <text x="34" y="438" font-size="20" fill="#111827">√2a/2</text>

  <line x1="118" y1="340" x2="118" y2="160" stroke="#111827" stroke-width="2"/>
  <line x1="108" y1="160" x2="128" y2="160" stroke="#111827" stroke-width="2"/>
  <text x="34" y="253" font-size="20" fill="#111827">√2a/2</text>

  <line x1="92" y1="520" x2="92" y2="160" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="92" y1="160" x2="92" y2="520" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="30" y="170" font-size="20" fill="#0284c7">√2a</text>

  <!-- x-axis scale mark to right vertex, echo hand label √2a -->
  <line x1="510" y1="508" x2="510" y2="532" stroke="#111827" stroke-width="2"/>
  <text x="488" y="560" font-size="20" fill="#111827">√2a</text>

  <!-- coordinates labels: muted, for reading integration bounds -->
  <text x="158" y="326" font-size="16" fill="#475569">(0,d/2)</text>
  <text x="340" y="154" font-size="16" fill="#475569">(d/2,d)</text>
  <text x="520" y="346" font-size="16" fill="#475569">(d,d/2)</text>
  <text x="340" y="512" font-size="16" fill="#475569">(d/2,0)</text>

  <!-- strips for the actual integral: upper and lower, lightly added to optimized diagram -->
  <line x1="240" y1="250" x2="420" y2="250" stroke="#f97316" stroke-width="9" stroke-linecap="round"/>
  <text x="555" y="248" font-size="17" fill="#ea580c">上半：</text>
  <text x="555" y="272" font-size="17" fill="#ea580c">x₂−x₁=2(d−y)</text>
  <line x1="555" y1="280" x2="715" y2="280" stroke="#f97316" stroke-width="2"/>

  <line x1="240" y1="430" x2="420" y2="430" stroke="#dc2626" stroke-width="9" stroke-linecap="round"/>
  <text x="555" y="428" font-size="17" fill="#dc2626">下半：</text>
  <text x="555" y="452" font-size="17" fill="#dc2626">x₄−x₃=2y</text>
  <line x1="555" y1="460" x2="670" y2="460" stroke="#dc2626" stroke-width="2"/>

  <!-- water depth annotation for arbitrary strip -->
  <line x1="705" y1="160" x2="705" y2="430" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="705" y1="430" x2="705" y2="160" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="420" y1="430" x2="700" y2="430" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="625" y="294" font-size="18" fill="#0284c7">水深</text>
  <text x="625" y="318" font-size="18" fill="#0284c7">h=d−y</text>

  <!-- small formula box -->
  <rect x="105" y="585" width="690" height="44" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="126" y="614" font-size="19" fill="#111827">d=√2a；左点高 d/2，顶点高 d，右端横坐标 d；按水平薄条分上下两段积分。</text>
</svg>
