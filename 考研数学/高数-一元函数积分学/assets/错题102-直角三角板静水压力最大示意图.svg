<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="230" y="42" font-size="25" font-weight="700" fill="#111827">直角三角板静水压力：形心法 + 微元法</text>

  <!-- water surface -->
  <line x1="120" y1="130" x2="850" y2="130" stroke="#0ea5e9" stroke-width="4"/>
  <text x="650" y="112" font-size="20" fill="#0284c7">水面 h=0</text>

  <!-- axes: x depth downward, y horizontal right (matching explanation) -->
  <line x1="170" y1="130" x2="170" y2="490" stroke="#111827" stroke-width="2.4" marker-end="url(#arrow)"/>
  <line x1="170" y1="130" x2="720" y2="130" stroke="#111827" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="153" y="510" font-size="22" fill="#111827">x 深度</text>
  <text x="700" y="137" font-size="22" fill="#111827">y</text>

  <!-- triangle: O=(170,130), top right=(570,130), lower right=(570,430) -->
  <polygon points="170,130 570,130 570,430" fill="#dbeafe" stroke="#2563eb" stroke-width="4" opacity="0.9"/>
  <line x1="170" y1="130" x2="570" y2="430" stroke="#1d4ed8" stroke-width="4"/>
  <line x1="570" y1="130" x2="570" y2="430" stroke="#1d4ed8" stroke-width="4"/>
  <line x1="170" y1="130" x2="570" y2="130" stroke="#1d4ed8" stroke-width="4"/>

  <!-- labels -->
  <text x="342" y="105" font-size="22" fill="#111827">水平直角边 b=cosθ</text>
  <text x="585" y="390" font-size="21" fill="#111827">h=sinθ</text>
  <text x="335" y="300" font-size="22" fill="#111827">斜边=1</text>
  <text x="190" y="160" font-size="19" fill="#111827">O</text>
  <text x="220" y="178" font-size="18" fill="#111827">斜边与水面夹角 θ</text>

  <!-- centroid -->
  <circle cx="436" cy="230" r="7" fill="#dc2626"/>
  <text x="450" y="235" font-size="20" fill="#dc2626">形心 C</text>
  <line x1="436" y1="130" x2="436" y2="230" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="448" y="185" font-size="20" fill="#dc2626">h_c=h/3</text>

  <!-- horizontal strip -->
  <line x1="300" y1="260" x2="570" y2="260" stroke="#f97316" stroke-width="9" stroke-linecap="round"/>
  <text x="610" y="270" font-size="19" fill="#ea580c">水平薄条</text>
  <text x="610" y="298" font-size="18" fill="#ea580c">w(x)=b-x·b/h</text>

  <!-- formula box -->
  <rect x="90" y="525" width="815" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="112" y="553" font-size="19" fill="#111827">形心法：P=ρgAh_c=ρg·(1/2)bh·(h/3)=ρg·b(1-b²)/6</text>
  <text x="112" y="582" font-size="19" fill="#111827">最大化 f(b)=b(1-b²)，得 b=1/√3=√3/3</text>
</svg>
